<style data-shared="base.css">
/* Winter, for Two — shared styles. Light, modern, delicate.
   Source of truth for the block inlined into every page by tools/inline-shared.py.
   Edit here, then run:  python3 tools/inline-shared.py */
:root{
  --bg:#fbf8f5;
  --bg-2:#f4eee8;
  --surface:rgba(255,255,255,.74);
  --solid:#ffffff;
  --line:rgba(70,45,30,.09);
  --line-2:rgba(70,45,30,.17);
  --ink:#2a2421;
  --ink-2:#5f5550;
  --ink-3:#9c918a;
  --me:#f0935a;         /* the human: apricot */
  --me-soft:#fde8da;
  --them:#a48bea;       /* the companion: lilac */
  --them-soft:#eee8fc;
  --accent:#f0935a;
  --sky:#8fb9ea;
  --mint:#7fcbb0;
  --butter:#f6d488;
  --blush:#f5c6cc;
  --sans:"Plus Jakarta Sans","Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif","LXGW WenKai TC",Georgia,serif;
  --hand:"Caveat","LXGW WenKai TC","Kaiti TC",cursive;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:24px;
  --shadow:0 20px 44px -26px rgba(90,55,30,.30),0 2px 6px -3px rgba(90,55,30,.08);
  color-scheme:light;
}
html[lang^="zh"]{--serif:"LXGW WenKai TC","Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip}
/* soft light in the corners */
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(36% 30% at 10% 6%,rgba(255,204,168,.55),transparent 70%),radial-gradient(34% 30% at 94% 10%,rgba(206,190,250,.5),transparent 70%),
    radial-gradient(42% 34% at 74% 98%,rgba(172,206,245,.42),transparent 70%),radial-gradient(30% 26% at 4% 90%,rgba(250,198,210,.42),transparent 70%)}
body.plain::before{display:none}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
img,svg,canvas{display:block}
::selection{background:rgba(240,147,90,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
html[lang^="zh"] .eyebrow{letter-spacing:.2em;font-size:12.5px}
.display{font-family:var(--sans);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:0;color:var(--ink)}
.display em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
html[lang^="zh"] .display{font-family:"LXGW WenKai TC",var(--sans);font-weight:400;letter-spacing:.02em;line-height:1.2}
html[lang^="zh"] .display em{font-style:normal}
.lede{color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:10px 0 0;font-weight:400}
.muted{color:var(--ink-3)}
.hand{font-family:var(--hand)}

/* ---------- top bar ---------- */
.w4-top{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none}
.w4-top>*{pointer-events:auto}
.w4-home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:600;height:38px;padding:0 14px 0 10px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:color .2s,border-color .2s}
.w4-home:hover{color:var(--ink);border-color:var(--line-2)}
.w4-home svg{width:15px;height:15px}
.w4-spacer{flex:1}
.w4-icon{min-width:38px;height:38px;flex:none;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.72);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0 10px;font-size:13px;font-weight:700;transition:color .2s,border-color .2s}
.w4-icon:hover{color:var(--ink);border-color:var(--line-2)}
.w4-icon svg{width:17px;height:17px}
.w4-icon[aria-pressed="false"]{color:var(--ink-3)}
.w4-icon[aria-pressed="false"] .on{display:none}
.w4-icon[aria-pressed="true"] .off{display:none}

/* ---------- buttons ---------- */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:rgba(255,255,255,.82);color:var(--ink);min-height:44px;padding:10px 18px;border-radius:999px;
  font-size:14.5px;font-weight:600;letter-spacing:.005em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  box-shadow:0 6px 16px -12px rgba(90,55,30,.35);transition:transform .15s ease,background .2s,border-color .2s,opacity .2s,box-shadow .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:#fff;border-color:rgba(70,45,30,.26)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px -12px rgba(42,36,33,.7)}
.btn.primary:hover{background:#3a322e}
.btn.soft{background:var(--me-soft);border-color:transparent;color:#a4532a}
.btn.soft.them{background:var(--them-soft);color:#6a4fc4}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink-2)}
.btn.ghost:hover{background:rgba(70,45,30,.05)}
.btn.small{min-height:36px;padding:6px 13px;font-size:13.5px}
.btn.round{width:44px;padding:0}
.btn.small.round{width:36px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .sub,.label .sub{font-weight:400;color:var(--ink-3)}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--line-2);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.input::placeholder{color:#b9aea6}
.input:focus{border-color:rgba(240,147,90,.7);box-shadow:0 0 0 4px rgba(240,147,90,.13)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5;display:block}
.count{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;position:relative;background-size:cover;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(90,55,30,.4);transition:transform .15s,box-shadow .2s;flex:none}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),0 4px 10px -6px rgba(90,55,30,.4)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.panel h2{font-weight:500;font-size:17px;letter-spacing:-.01em;margin:0}
.panel .sub{color:var(--ink-3);font-size:13.5px;margin:3px 0 12px}

/* ---------- sheets (dialogs) ---------- */
dialog.w4-sheet{border:0;padding:0;margin:auto;background:transparent;color:var(--ink);max-width:min(540px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);overflow:visible}
dialog.w4-sheet::backdrop{background:rgba(60,40,30,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.w4-sheet[open]{animation:w4-rise .34s cubic-bezier(.2,.9,.3,1.12)}
.w4-sheet-in{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;box-shadow:0 40px 90px -36px rgba(70,40,20,.45);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.w4-sheet-in h3{font-weight:500;font-size:21px;letter-spacing:-.015em;line-height:1.2;margin:0}
.w4-sheet-in p{margin:0}
.w4-sheet-in textarea.input{min-height:170px;font-size:14.5px;background:var(--bg)}
.w4-sheet .tip{font-size:13.5px;color:var(--ink-3);line-height:1.5}
.w4-sheet .tip b{color:var(--ink-2);font-weight:600}
.w4-sheet .err{font-size:13.5px;color:#c4523a}
@keyframes w4-rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
.w4-toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;z-index:120;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:0 16px 36px -14px rgba(42,36,33,.6);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px);text-align:center}
.w4-toast.show{opacity:1;transform:translate(-50%,0)}

/* a gentle "look here" */
.pulse{animation:w4-pulse 2.4s ease-in-out infinite}
@keyframes w4-pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,147,90,0)}50%{box-shadow:0 0 0 7px rgba(240,147,90,.18)}}

/* ---------- the two voices ---------- */
.bridge{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who-me{color:var(--me)}
.who-them{color:var(--them)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}
.dot.me{background:var(--me)}.dot.them{background:var(--them)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
  .room{position:relative;padding:72px 16px 60px;overflow-x:hidden;overflow-x:clip}
  .head{text-align:center;margin:0 auto 4px;max-width:560px}
  .head h1{font-size:clamp(30px,7.5vw,46px)}
  .band{position:relative;margin:4px -16px 0}
  .scene{position:relative;z-index:1;margin:0 auto;width:min(94vw,440px)}
  .table{position:absolute;left:0;right:0;bottom:5%;height:30%;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#f1e8de 0%,#f6efe8 50%,rgba(251,248,245,0) 100%);
    -webkit-mask-image:radial-gradient(55% 100% at 50% 0%,#000 50%,transparent 100%);mask-image:radial-gradient(55% 100% at 50% 0%,#000 50%,transparent 100%)}
  .stage{position:relative;width:100%;aspect-ratio:1/.95;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none}
  .stage.tearing{touch-action:none;cursor:grab}
  .gift{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,1.7,.45,1)}
  .gift.held{transition:none}
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .shadow{position:absolute;left:20%;right:20%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(90,55,30,.28),rgba(90,55,30,0));filter:blur(3px)}
  .box{position:absolute;inset:0;pointer-events:none}
  .box-front{position:absolute;background:linear-gradient(180deg,#ffffff,#f1ebe5);box-shadow:inset 0 -18px 30px -18px rgba(90,60,30,.18),inset 1px 0 0 rgba(255,255,255,.8)}
  .lid{position:absolute;inset:0;transform-origin:50% 30%;transition:transform 1s cubic-bezier(.3,1.25,.4,1)}
  .lid-top{position:absolute;background:linear-gradient(180deg,#ffffff,#f6f1ec)}
  .lid-lip{position:absolute;background:linear-gradient(180deg,#fbf8f5,#ece4dc);box-shadow:0 6px 10px -7px rgba(60,35,15,.35);border-bottom:1.5px solid #e2c48a}
  .box.open .lid{transform:translate(-27%,-13%) rotate(-17deg)}
  .glow{position:absolute;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(closest-side,rgba(255,236,190,.95),rgba(255,210,150,.4) 45%,rgba(255,200,140,0) 75%)}
  .box.open .glow{opacity:1}
  .rays{position:absolute;pointer-events:none;opacity:0;transition:opacity 1.4s;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,214,160,.35) 0 6deg,rgba(255,214,160,0) 6deg 18deg);
    -webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);mask-image:radial-gradient(closest-side,#000 25%,transparent 100%);animation:spin 40s linear infinite}
  .box.open .rays{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  #paper{transition:transform .9s cubic-bezier(.5,0,.75,0),opacity .9s ease-in}
  #paper.fall{transform:translateY(55%) rotate(8deg);opacity:0}
  .tag{position:absolute;z-index:3;width:32%;min-width:112px;padding:9px 10px 9px 17px;border-radius:5px 12px 12px 5px;background:#fff;color:#4a3a30;
    font-family:var(--hand);font-size:19px;line-height:1.05;box-shadow:0 10px 20px -10px rgba(90,55,30,.45),0 0 0 1px rgba(70,45,30,.06);transform-origin:12% 10%;transform:rotate(8deg);transition:transform .8s cubic-bezier(.3,1.6,.5,1),opacity .6s;pointer-events:none}
  html[lang^="zh"] .tag{font-size:16px;line-height:1.25}
  .tag::before{content:"";position:absolute;left:7px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px #e2c48a}
  .tag b{display:block;font-weight:600;font-size:15px;color:#a08a78}
  html[lang^="zh"] .tag b{font-size:13px}
  .tag .msg{display:block;margin:3px 0;font-size:20px;word-break:break-word}
  html[lang^="zh"] .tag .msg{font-size:16px}
  .gift.swing .tag{animation:swing 1.2s ease-out}
  @keyframes swing{0%{transform:rotate(8deg)}20%{transform:rotate(-10deg)}45%{transform:rotate(14deg)}70%{transform:rotate(3deg)}100%{transform:rotate(8deg)}}
  .tag.gone{transform:translateY(70px) rotate(40deg);opacity:0}
  .bubble{position:absolute;z-index:4;left:50%;top:2%;transform:translate(-50%,8px) scale(.92);opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.2,1.6,.4,1);
    background:#fff;color:#3a2f2a;padding:10px 16px;border-radius:18px;font-family:var(--hand);font-size:22px;line-height:1.15;max-width:86%;text-align:center;box-shadow:0 14px 30px -14px rgba(90,55,30,.5);pointer-events:none}
  html[lang^="zh"] .bubble{font-size:18px;line-height:1.35}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
  .bubble small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin-bottom:3px}
  .bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .note{position:absolute;z-index:5;left:50%;top:50%;width:min(86%,380px);transform:translate(-50%,-10%) scale(.4) rotate(-3deg);opacity:0;transition:transform 1.3s cubic-bezier(.2,1,.3,1),opacity .7s;pointer-events:none;
    background:#fff;color:#3a2f2a;border-radius:16px;padding:20px 22px 16px;box-shadow:0 30px 60px -28px rgba(90,55,30,.55),0 0 0 1px rgba(70,45,30,.05)}
  .note.up{transform:translate(-50%,-62%) scale(1) rotate(-1.5deg);opacity:1;pointer-events:auto}
  .note .k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  html[lang^="zh"] .note .k,html[lang^="zh"] .bubble small{text-transform:none;letter-spacing:.1em;font-size:12px}
  .note .t{font-family:var(--hand);font-size:clamp(23px,5.4vw,28px);line-height:1.18;white-space:pre-wrap;word-break:break-word;min-height:1.2em}
  html[lang^="zh"] .note .t{font-size:clamp(18px,4.4vw,22px);line-height:1.55}
  .note .sig{font-family:var(--hand);font-size:21px;color:var(--ink-3);text-align:right;margin-top:8px;opacity:0;transition:opacity .8s}
  .note.done .sig{opacity:1}
  .hint{text-align:center;color:var(--ink-2);font-size:14.5px;margin:2px auto 12px;min-height:24px;position:relative;z-index:2}
  .hint b{color:var(--accent);font-weight:600}
  .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:22px;position:relative;z-index:2}
  .panels{max-width:620px;margin:0 auto;display:grid;gap:14px}
  .choices{display:grid;gap:12px;grid-template-columns:1fr}
  @media (min-width:640px){ .choices{grid-template-columns:1fr 1fr} }
  .choice{appearance:none;text-align:left;cursor:pointer;color:var(--ink);padding:16px 18px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.78);box-shadow:var(--shadow);transition:transform .2s,border-color .2s;display:flex;gap:14px;align-items:flex-start}
  .choice:hover{transform:translateY(-2px);border-color:var(--line-2)}
  .choice .ic{font-size:24px;line-height:1;flex:none;margin-top:2px}
  .choice h3{margin:0;font-weight:600;font-size:16px}
  .choice p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}
  .form{padding:18px;display:grid;gap:16px}
  .papers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (min-width:520px){ .papers{grid-template-columns:repeat(8,1fr)} }
  .paperbtn{appearance:none;aspect-ratio:1;border-radius:14px;border:2px solid #fff;cursor:pointer;padding:0;background-size:48px 48px;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(90,55,30,.4);transition:transform .15s,box-shadow .2s}
  .paperbtn:hover{transform:scale(1.05)}
  .paperbtn[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),0 4px 10px -6px rgba(90,55,30,.4)}
  .shelf{padding:18px}

</style>

<body>
<main class="room">
  <header class="head">

<script data-shared="bridge.js">
/* Winter, for Two — the bridge.
   You play with your hands; your companion plays with words. These helpers carry

(function(){

const NS = 'w4t:';

  get(k, d){ try{ const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },

W4.i18n({

    you: 'You', companion: 'Your companion', yourName: 'your name', theirName: 'their name', cancel: 'Cancel', save: 'Save', close: 'Close', copy: 'Copy', share: 'Share…',
    sendTitle: 'Send this to {them}', sendTip: 'Paste it into your chat. Change any words first — it’s your voice.', copied: 'Copied — paste it to {them} ✦', copyBlocked: 'Copying was blocked — select the text and copy it',
    receiveTitle: 'Paste {their} reply', receiveTip: 'Paste their whole message. Extra words are fine.', pasteClip: 'Paste from clipboard', clipEmpty: 'The clipboard is empty',
    clipDenied: 'Not allowed — long-press the box and paste', open: 'Open it', fromThem: 'From {them}', forThem: 'For {them}', sound: 'Sound', langBtn: '中', langName: '中文',
    meDefault: 'you', themDefault: 'your companion', ThemDefault: 'Your companion', imageFail: 'Couldn’t make the image' },
  zh: { site: '兩個人的冬天', who: '誰在玩', namesTitle: '兩個名字就好', namesTip: '只用來寫標籤和訊息，只存在這個瀏覽器。',
    you: '你', companion: '你的 AI 夥伴', yourName: '你的名字', theirName: '對方的名字', cancel: '取消', save: '儲存', close: '關閉', copy: '複製', share: '分享…',
    sendTitle: '傳給{them}', sendTip: '貼到你們的對話裡。想改哪個字都可以——這是你的語氣。', copied: '已複製，貼給{them}吧 ✦', copyBlocked: '瀏覽器擋住了複製——請選取文字後自行複製',
    receiveTitle: '貼上{their}回覆', receiveTip: '整段貼上就好，多出來的字沒關係。', pasteClip: '從剪貼簿貼上', clipEmpty: '剪貼簿是空的',
    clipDenied: '瀏覽器不允許——請長按輸入框貼上', open: '打開', fromThem: '來自{them}', forThem: '給{them}', sound: '聲音', langBtn: 'EN', langName: 'English',
    meDefault: '你', themDefault: '對方', ThemDefault: '對方', imageFail: '圖片做不出來' }
});

/* ---------- small helpers ---------- */
W4.$ = (s, r) => (r || document).querySelector(s);
W4.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
W4.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

W4.date = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short', year:'numeric' });
W4.shortDate = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short' });
W4.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
W4.pick = a => a[Math.floor(Math.random() * a.length)];

W4.games = {
  'window':    { path:'window/',     title:{ en:'The Other Side of the Glass', zh:'隔著玻璃' } },
  'snowflakes':{ path:'snowflakes/', title:{ en:'Snowflakes from Words',       zh:'字成雪花' } },
  'gifts':     { path:'gifts/',      title:{ en:'Impossible Gifts',            zh:'不可能的禮物' } },
  'music-box': { path:'music-box/',  title:{ en:'Music Box Duet',              zh:'音樂盒二重奏' } },
  'star-jar':  { path:'star-jar/',   title:{ en:'A Jar of Small Stars',        zh:'一罐小星星' } },
  'cracker':   { path:'cracker/',    title:{ en:'Pull a Cracker',              zh:'聖誕拉炮' } }
};

/* ---------- names ---------- */
W4.names = function(){
  const me = String(W4.store.get('me', '') || '').trim();
  const them = String(W4.store.get('them', '') || '').trim();
  return { me: me || W4.t('meDefault'), them: them || W4.t('themDefault'), Them: them || W4.t('ThemDefault'), meName: me, themName: them,
    their: them ? W4.poss(them) : (W4.zh ? '對方的' : 'their') };
};
W4.onNames = cb => document.addEventListener('w4:names', cb);
W4.editNames = function(onDone){
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.t('who')}</p>
    <h3>${W4.t('namesTitle')}</h3>
    <p class="tip">${W4.t('namesTip')}</p>
    <div class="field"><label for="w4-me">${W4.t('you')}</label><input id="w4-me" class="input" maxlength="24" autocomplete="nickname" placeholder="${W4.t('yourName')}"></div>
    <div class="field"><label for="w4-them">${W4.t('companion')}</label><input id="w4-them" class="input" maxlength="24" autocomplete="off" placeholder="${W4.t('theirName')}"></div>
    <div class="row end"><button class="btn ghost" data-a="close">${W4.t('cancel')}</button><button class="btn primary" data-a="save">${W4.t('save')}</button></div>
  </div>`);

  me.value = n.meName; them.value = n.themName;
  d.querySelector('[data-a="save"]').onclick = () => {
    W4.store.set('me', me.value.trim()); W4.store.set('them', them.value.trim());

/* ---------- toast ---------- */
let toastEl = null, toastTimer = 0;
W4.toast = function(msg, ms){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'w4-toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite');
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2800);
};

/* ---------- sheets (modal dialogs) ---------- */
W4.sheet = function(html, cls){
  const d = document.createElement('dialog');
  d.className = 'w4-sheet' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  document.body.appendChild(d);
  let gone = false;
  const cleanup = () => { if(!gone){ gone = true; d.remove(); if(d.onDone) d.onDone(); } };
  d.done = () => { if(typeof d.close === 'function' && d.open) d.close(); else cleanup(); };
  d.addEventListener('close', () => setTimeout(cleanup, 30));
  d.addEventListener('click', e => {
    if(e.target === d) d.done();
    else if(e.target.closest('[data-a="close"]')) d.done();
  });
  if(typeof d.showModal === 'function') d.showModal();
  else { d.setAttribute('open', ''); d.style.cssText = 'position:fixed;inset:0;z-index:100;margin:auto'; }
  return d;
};

/* ---------- clipboard ---------- */
W4.copy = async function(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;';
    (document.querySelector('dialog[open]') || document.body).appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
};

/* Step 1 of the bridge: show the words you’re about to send, let you edit, copy. */
W4.send = function(text, opt){
  opt = opt || {};
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(opt.eyebrow || W4.t('forThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('sendTitle', { them: n.them }))}</h3>
    <p class="tip">${opt.tip || W4.t('sendTip')}</p>
    <textarea class="input" spellcheck="false" aria-label="${W4.esc(W4.t('sendTitle', { them: n.them }))}"></textarea>
    <div class="row end">
      <button class="btn ghost" data-a="close">${W4.t('close')}</button>
      ${navigator.share && W4.coarse ? `<button class="btn" data-a="share">${W4.t('share')}</button>` : ''}
      <button class="btn primary" data-a="copy">${W4.t('copy')}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea');
  ta.value = text;
  d.querySelector('[data-a="copy"]').onclick = async () => {
    const ok = await W4.copy(ta.value);
    if(ok){ d.done(); W4.toast(opt.copied || W4.t('copied', { them: n.them })); if(opt.onSent) opt.onSent(ta.value); }

  };

    try{ await navigator.share({ text: ta.value }); d.done(); if(opt.onSent) opt.onSent(ta.value); }catch(e){}
  };
  return d;
};

/* Step 2 of the bridge: paste their reply back in. onText returns a string to show an error. */
W4.receive = function(opt){
  opt = opt || {};
  const n = W4.names();
  const canRead = !!(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext);
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(W4.t('fromThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('receiveTitle', { their: n.their }))}</h3>
    <p class="tip">${opt.tip || W4.t('receiveTip')}</p>
    <textarea class="input" spellcheck="false" placeholder="${W4.esc(opt.placeholder || '')}" aria-label="${W4.esc(W4.t('receiveTitle', { their: n.their }))}"></textarea>
    <p class="err" role="alert" hidden></p>
    <div class="row">
      ${canRead ? `<button class="btn small" data-a="clip">${W4.t('pasteClip')}</button>` : ''}
      <span class="spacer"></span>
      <button class="btn ghost" data-a="close">${W4.t('cancel')}</button>
      <button class="btn primary" data-a="go">${W4.esc(opt.go || W4.t('open'))}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea'), err = d.querySelector('.err');
  const clip = d.querySelector('[data-a="clip"]');
  if(clip) clip.onclick = async () => {
    try{ const t = await navigator.clipboard.readText(); if(t && t.trim()) ta.value = t; else W4.toast(W4.t('clipEmpty')); }
    catch(e){ W4.toast(W4.t('clipDenied')); }
  };
  d.querySelector('[data-a="go"]').onclick = () => {
    const t = ta.value.trim();
    if(!t){ ta.focus(); return; }
    const res = opt.onText(t);
    if(typeof res === 'string'){ err.textContent = res; err.hidden = false; return; }
    d.done();
  };
  if(!W4.coarse) setTimeout(() => ta.focus(), 60);
  return d;
};

/* ---------- state in the URL (#hash is never sent to the server) ---------- */
W4.enc = function(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let s = '';
  for(let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
W4.dec = function(str){
  try{
    let s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    const bin = atob(s), b = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(b));
  }catch(e){ return null; }
};
W4.params = function(){
  const map = {};
  const add = (k, v) => { k = k.toLowerCase().trim(); (map[k] = map[k] || []).push(v); };
  try{ new URLSearchParams(location.search).forEach((v, k) => add(k, v)); }catch(e){}
  const h = location.hash.replace(/^#/, '');
  if(h.includes('=')){ try{ new URLSearchParams(h).forEach((v, k) => add(k, v)); }catch(e){} }
  return { get: k => (map[k] || [])[0], all: k => map[k] || [], has: k => k in map, any: () => Object.keys(map).length > 0 };
};
/* A reply routed here from the home page’s “paste anything” box arrives as #paste=… */
W4.pasted = function(){ const v = W4.params().get('paste'); const t = v ? W4.dec(v) : null; return typeof t === 'string' ? t : null; };
W4.clearURL = function(){ try{ history.replaceState(null, '', location.pathname); }catch(e){} };
W4.link = function(obj){ return W4.here() + '#' + new URLSearchParams(obj).toString(); };

/* ---------- the forgiving reader ---------- */
/* Companions decorate. They add **bold**, emoji, *smiles softly*, quotes. We let them. */
W4.clean = function(s){
  s = String(s == null ? '' : s).replace(/\r/g, '').replace(/\*\*|__/g, '');
  s = s.replace(/^[\s*_~`]+|[\s*_~`]+$/g, '');
  const q = s.match(/^["“”'‘’「『«]([\s\S]*)["“”'‘’」』»]$/);
  if(q) s = q[1];
  return s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
};
W4.stripActions = s => String(s || '')
  .replace(/(^|\s)\*[^*\n]{1,140}\*(?=\s|$|[.,!?。，！？])/g, ' ')
  .replace(/(^|\s)[(（][^()（）\n]{1,140}[)）](?=\s|$)/g, ' ');
/* Read “Label: value” lines. spec = { key: ['label', 'synonym', …] } */
W4.fields = function(text, spec){
  const out = {}; let cur = null;
  const norm = s => s.toLowerCase().replace(/[*_`~#>\[\]()"“”「」【】]/g, '').replace(/\s+/g, ' ').trim();
  const keyOf = label => {
    const l = norm(label);
    if(!l || l.length > 28) return null;
    for(const k in spec) for(const syn of spec[k]){
      if(l === syn || l.startsWith(syn + ' ') || l.endsWith(' ' + syn)) return k;
    }
    return null;
  };
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  for(const raw of lines){
    const line = raw.replace(/^[\s>•·▪◦*+\-–—#]+/, '').replace(/^(?:\p{Extended_Pictographic}|️|‍|⃣)+\s*/u, '');
    const m = line.match(/^([^:：\n]{1,30}?)\s*[:：]\s*(.*)$/);
    if(m){
      const k = keyOf(m[1]);
      if(k){ cur = k; out[k] = out[k] ? out[k] + '\n' + m[2] : m[2]; continue; }
      if(/^\p{L}[\p{L} ']{0,22}$/u.test(norm(m[1]))){ cur = null; continue; }
    }
    if(!line.trim()){ if(cur && String(out[cur]).trim()) cur = null; continue; }
    if(cur) out[cur] += (String(out[cur]).trim() ? '\n' : '') + line.trim();
  }
  for(const k in out){ out[k] = W4.clean(out[k]); if(!out[k]) delete out[k]; }
  return out;
};
/* One short value: the labelled line if there is one, else a quoted phrase, else the message itself. */
W4.one = function(text, labels, max){
  max = max || 160;
  const f = W4.fields(text, { v: labels });
  let v = f.v;
  if(!v){
    const q = String(text).match(/["“「『]([^"”」』\n]{2,240})["”」』]/);
    v = q ? q[1] : W4.stripActions(text);
  }
  v = W4.clean(v).replace(/\s*\n\s*/g, ' ');
  if([...v].length > max){ v = [...v].slice(0, max).join('').replace(/\s+\S*$/, '') + '…'; }
  return v;
};
/* Which game is a pasted reply for? (Used by the home page’s “paste anything” box.) */
W4.detect = function(text){
  const t = String(text || '');
  const L = w => new RegExp('(^|\\n)[\\s>*_#•\\-–—]*(?:\\p{Extended_Pictographic}|\\uFE0F)*\\s*\\**(?:' + w + ')\\**\\s*[:：]', 'iu');
  if(L('glass|玻璃|窗上').test(t)) return 'window';
  if(L('flake|snowflake|雪花').test(t)) return 'snowflakes';
  if(L('inside|rattle|wrapping|paper|裡面|裏面|包裝紙|搖晃|聲音').test(t)) return 'gifts';
  if(L('notes?|melody|音符|旋律').test(t)) return 'music-box';
  if(L('punchline|grip|trinket|crown|笑點|握力|小玩意|紙皇冠|皇冠').test(t)) return 'cracker';
  if(/(^|\n)\s*[★⭐☆✦✧🌟]/u.test(t)) return 'star-jar';
  return null;
};

/* ---------- sound (synthesised, nothing to download) ---------- */
let actx = null, noiseBuf = null;
W4.soundOn = () => W4.store.get('sound', true) !== false;
W4.audio = function(){
  if(!W4.soundOn()) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx){ try{ actx = new AC(); }catch(e){ return null; } }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
};
W4.noise = function(ctx){
  if(noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
};
/* filtered-noise gesture: paper, breath, snow, wind */
W4.whoosh = function(o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ dur:.5, freq:900, q:.7, gain:.16, type:'bandpass', attack:.04, sweep:0, delay:0 }, o || {});
  const t = ctx.currentTime + o.delay;
  const src = ctx.createBufferSource(); src.buffer = W4.noise(ctx); src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = o.type; f.Q.value = o.q;
  f.frequency.setValueAtTime(o.freq, t);
  if(o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain, t + o.attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(t, Math.random()); src.stop(t + o.dur + .05);
};
/* small bell: freqs in Hz, played as a little arpeggio */
W4.chime = function(freqs, o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ gap:.09, gain:.1, decay:1.6 }, o || {});
  const t0 = ctx.currentTime + .01;
  [].concat(freqs).forEach((f, i) => {
    const t = t0 + i * o.gap;
    [[1, 1], [2.76, .26], [5.4, .08]].forEach(p => {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f * p[0];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain * p[1], t + .006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.decay / (.6 + p[0] * .4));
      osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + o.decay + .1);
    });
  });
};

/* ---------- save a canvas as an image (share sheet on phones) ---------- */
W4.saveCanvas = function(canvas, filename){
  canvas.toBlob(async blob => {
    if(!blob){ W4.toast(W4.t('imageFail')); return; }
    try{
      const file = new File([blob], filename, { type:'image/png' });
      if(W4.coarse && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
W4.downloadText = function(text, filename, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* ---------- gentle background snowfall ---------- */
W4.snowfall = function(canvas, o){
  o = Object.assign({ density:1, speed:1, color:'255,255,255', alpha:1 }, o || {});
  const ctx = canvas.getContext('2d'); let w = 0, h = 0, raf = 0, last = performance.now();
  const flakes = [];
  const make = any => { const z = Math.random(); return { x: Math.random() * w, y: any ? Math.random() * h : -8, r: .6 + z * 2, z, vy: (12 + z * 34) * o.speed, ph: Math.random() * 6.28, sw: 6 + Math.random() * 16 }; };
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 9000 * o.density);
    while(flakes.length < n) flakes.push(make(true));
    flakes.length = n;
    if(W4.reduced) draw(last);
  }
  function draw(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = 'rgb(' + o.color + ')';
    for(const f of flakes){
      f.y += f.vy * dt; f.ph += dt * (.5 + f.z);
      if(f.y > h + 6) Object.assign(f, make(false));
      ctx.globalAlpha = (.22 + f.z * .6) * o.alpha;
      ctx.beginPath(); ctx.arc(f.x + Math.sin(f.ph) * f.sw * .35, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const loop = t => { draw(t); raf = requestAnimationFrame(loop); };
  size(); addEventListener('resize', size);
  if(!W4.reduced) raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if(!document.hidden && !W4.reduced){ last = performance.now(); raf = requestAnimationFrame(loop); }
  });
};

function rattleSound(){ if(!W4.audio()) return; for(let i = 0; i < 4; i++) W4.whoosh({ dur: .06 + Math.random() * .05, freq: 1800 + Math.random() * 2400, q: 4, gain: .12, attack: .003, delay: i * .045 + Math.random() * .02 }); W4.whoosh({ dur: .25, freq: 500, q: .8, gain: .06, type: 'lowpass', attack: .01 }); }
function tearSound(k){ W4.whoosh({ dur: .12 + Math.random() * .1, freq: 2200 + Math.random() * 1800, q: 1.1, gain: Math.min(.22, .06 + k * .2), attack: .004, sweep: 900 }); }
let scraps = [], confetti = [], fxRaf = 0, lastFx = 0;
function addScrap(x, y, vx, vy, P){
  const n = 4 + (Math.random() * 3 | 0), s = 6 + Math.random() * 14, pts = [];
  for(let i = 0; i < n; i++){ const a = i / n * TAU + Math.random() * .6; pts.push([Math.cos(a) * s * (.5 + Math.random() * .6), Math.sin(a) * s * (.5 + Math.random() * .6)]); }
  scraps.push({ x, y, vx, vy, r: Math.random() * TAU, vr: (Math.random() - .5) * 9, pts, P, life: 1 });
  if(!fxRaf) fxRaf = requestAnimationFrame(fxFrame);
}
function fxFrame(now){
  const dt = Math.min(.05, (now - (lastFx || now)) / 1000); lastFx = now;
  const g = fxC.getContext('2d'); g.clearRect(0, 0, G.W, G.H);
  for(const s of scraps){
    s.vy += 900 * dt; s.vx *= .985; s.x += s.vx * dt; s.y += s.vy * dt; s.r += s.vr * dt; s.life -= dt * .7;
    if(s.life <= 0) continue;
    g.save(); g.globalAlpha = Math.min(1, s.life * 2); g.translate(s.x, s.y); g.rotate(s.r);
    g.beginPath(); s.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.fillStyle = s.P.pat || (s.P.pat = patternFor(g, s.P, DPR)); g.fill(); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = .8; g.stroke();
    g.restore();
  }
  scraps = scraps.filter(s => s.life > 0 && s.y < G.H + 80);
  for(const p of confetti){ p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt * .5; if(p.life > 0){ g.save(); g.globalAlpha = Math.min(1, p.life * 2); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); } }
  confetti = confetti.filter(p => p.life > 0);
  fxRaf = (scraps.length || confetti.length) ? requestAnimationFrame(fxFrame) : 0;
  if(!fxRaf){ lastFx = 0; g.clearRect(0, 0, G.W, G.H); }
}
function sparkle(){
  const cols = ['#f6c48a', '#f3b6c4', '#c9bdf0', '#ffffff', '#bfe5d3', '#fbe6ac'];
  for(let i = 0; i < 46; i++){ const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 180 + Math.random() * 320; confetti.push({ x: G.cx, y: G.by - G.td * .4, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * TAU, vr: (Math.random() - .5) * 12, s: 4 + Math.random() * 6, c: W4.pick(cols), life: 1 }); }
  if(!fxRaf) fxRaf = requestAnimationFrame(fxFrame);
}
let grid = null, gridLeft = 0, gridTotal = 0;
function makeGrid(){
  const g = paperC.getContext('2d'), N = 22; grid = []; gridTotal = 0;
  for(let j = 0; j < N; j++) for(let i = 0; i < N; i++){
    const x = G.bx + (i + .5) / N * G.bw, y = G.by - G.td + (j + .5) / N * (G.bh + G.td);
    pathFront(g); let inside = g.isPointInPath(x * DPR, y * DPR);
    if(!inside){ pathTop(g); inside = g.isPointInPath(x * DPR, y * DPR); }
    if(inside){ grid.push({ x, y, on: true }); gridTotal++; }
  }
  gridLeft = gridTotal;
}
function tearSegment(x0, y0, x1, y1){
  const g = paperC.getContext('2d');
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d, w = G.W * .045;
  const n = Math.max(2, Math.ceil(d / 7)), L = [], Rr = [];
  for(let i = 0; i <= n; i++){ const t = i / n, x = x0 + dx * t, y = y0 + dy * t; L.push([x + nx * w * (.6 + Math.random() * .7), y + ny * w * (.6 + Math.random() * .7)]); Rr.push([x - nx * w * (.6 + Math.random() * .7), y - ny * w * (.6 + Math.random() * .7)]); }
  g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath();
  L.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); Rr.reverse().forEach(p => g.lineTo(p[0], p[1])); g.closePath(); g.fill();
  g.beginPath(); g.arc(x1, y1, w * 1.05, 0, TAU); g.fill();
  g.restore();
  for(const c of grid) if(c.on){ const t = Math.max(0, Math.min(1, ((c.x - x0) * dx + (c.y - y0) * dy) / (d * d))); if(Math.hypot(c.x - (x0 + dx * t), c.y - (y0 + dy * t)) < w * 1.25){ c.on = false; gridLeft--; } }
}

stage.addEventListener('pointermove', e => {
  if(!drag) return;
  const r = stage.getBoundingClientRect();

    const dx = e.clientX - drag.x0, step = e.clientX - drag.lx, dir = Math.sign(step);

}
function shelfHTML(unopened){
  const n = W4.names();
  if(!shelf.length) return `<div class="panel shelf"><h2>${W4.t('shelf')}</h2><p class="sub" style="margin-bottom:0">${W4.t('shelfEmpty')}</p></div>`;
  return `<div class="panel shelf"><h2>${W4.t('shelf')}</h2><p class="sub">${shelf.length === 1 ? W4.t('shelfOne') : W4.t('shelfSub', { n: shelf.length })}${unopened.length ? ` · <b style="color:var(--accent)">${W4.t('stillWrapped', { n: unopened.length })}</b>` : ''}</p><ul>${shelf.map(g => `
    <li><button type="button" data-id="${g.id}"><span class="mini" style="background:${g.paper.bg};--rb:${g.ribbon.color}"></span>
      <span class="what"><b>${W4.esc(W4.t(g.dir === 'from' ? 'from' : 'for', { them: n.them }))} · ${W4.date(g.date)}${g.dir === 'from' && !g.opened ? ` · <span style="color:var(--accent)">${W4.t('unopened')}</span>` : ''}</b>
      <span>${g.dir === 'from' && !g.opened ? W4.t('stillWrappedRow') : W4.esc(g.inside)}</span></span></button></li>`).join('')}</ul></div>`;
}
function pasteGift(){ W4.receive({ title: W4.t('pasteTitle'), tip: W4.t('pasteTip'), placeholder: W4.t('pastePh'), go: W4.t('pasteGo'), onText: receiveGift }); }
function home(){
  state = 'idle';
  const last = shelf[0], n = W4.names();
  gift = last ? Object.assign({}, last) : { paper: PAPERS[0], ribbon: RIBBONS[1], tag: { to: n.me, from: n.them, msg: '' }, inside: '' };
  resetBox(); paint(); requestAnimationFrame(() => drawRibbon(gift.ribbon, 0, tagPos()));
  render();
}
function startWrap(){
  state = 'wrapping'; gift = draftGift(); resetBox();
  paint(); requestAnimationFrame(() => drawRibbon(gift.ribbon, 0, tagPos()));
  render(); scrollTo({ top: 0, behavior: W4.reduced ? 'auto' : 'smooth' });
}
function renderWrap(){
  const n = W4.names();
  hint(W4.t('hintWrapping')); controls([]);
  $('#panels').innerHTML = `<div class="panel form">
    <h2>${W4.esc(W4.t('wrapTitle', { them: n.them }))}</h2>
    <div class="field"><label for="inside">${W4.t('insideLabel')} <span class="sub">${W4.t('insideSub')}</span></label>
      <textarea id="inside" class="input" maxlength="600" placeholder="${W4.esc(W4.pick(W4.L(IDEAS)))}"></textarea>
      <div class="row"><button class="link" id="idea" type="button">${W4.t('idea')}</button><span class="spacer"></span><span class="count" id="insideCount"></span></div></div>
    <div class="field"><label for="rattle">${W4.t('rattleLabel')} <span class="sub">${W4.t('rattleSub')}</span></label>
      <input id="rattle" class="input" maxlength="90" placeholder="${W4.esc(W4.pick(W4.L(RATTLES)))}"></div>
    <div class="field"><span class="label">${W4.t('paperLabel')}</span><div class="papers" role="radiogroup" aria-label="${W4.esc(W4.t('paperLabel'))}" id="papers"></div></div>
    <div class="field"><span class="label">${W4.t('ribbonLabel')}</span><div class="swatches" role="radiogroup" aria-label="${W4.esc(W4.t('ribbonLabel'))}" id="ribbons"></div></div>
    <div class="field"><label for="msg">${W4.t('tagLabel')} <span class="sub">${W4.esc(W4.t('tagSub', { them: n.them, me: n.me }))}</span></label><input id="msg" class="input" maxlength="60" placeholder="${W4.esc(W4.t('tagPh'))}"></div>
    <div class="row end"><button class="btn ghost" id="cancel" type="button">${W4.t('back')}</button><button class="btn primary" id="wrapIt" type="button">${W4.t('wrapIt')}</button></div></div>`;
  const inside = $('#inside'), rattle = $('#rattle'), msg = $('#msg');
  inside.value = draft.inside; rattle.value = draft.rattle; msg.value = draft.msg;
  const count = () => $('#insideCount').textContent = inside.value.length ? `${inside.value.length}/600` : '';
  count();
  const sync = () => { draft.inside = inside.value; draft.rattle = rattle.value; draft.msg = msg.value; W4.store.set('gift-draft2', draft); gift = draftGift(); paint(); count(); };
  inside.oninput = sync; rattle.oninput = sync; msg.oninput = sync;
  $('#idea').onclick = () => { inside.value = W4.pick(W4.L(IDEAS)); sync(); };
  PAPERS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'paperbtn'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', W4.L(p.name)); b.title = W4.L(p.name);
    b.setAttribute('aria-checked', String(i === draft.paper)); b.style.backgroundImage = `url(${tile(p, 1).toDataURL()})`;
    b.onclick = () => { draft.paper = i; W4.$$('.paperbtn').forEach((x, j) => x.setAttribute('aria-checked', String(j === i))); sync(); W4.whoosh({ dur: .25, freq: 2500, q: .7, gain: .06 }); };
    $('#papers').append(b);
  });
  RIBBONS.forEach((r, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', W4.L(r.name)); b.title = W4.L(r.name);
    b.setAttribute('aria-checked', String(i === draft.ribbon));
    b.style.background = r.style === 'twine' ? `repeating-linear-gradient(45deg,${r.color} 0 3px,${shade(r.color, -.2)} 3px 6px)` : `linear-gradient(180deg,${shade(r.color, .35)},${r.color} 55%,${shade(r.color, -.25)})`;
    b.onclick = () => { draft.ribbon = i; W4.$$('#ribbons .swatch').forEach((x, j) => x.setAttribute('aria-checked', String(j === i))); sync(); };
    $('#ribbons').append(b);
  });
  $('#cancel').onclick = home;
  $('#wrapIt').onclick = () => {
    if(!inside.value.trim()){ inside.focus(); W4.toast(W4.t('putInside')); return; }
    wrapAnimation(() => { gift = draftGift(); state = 'ready'; render(); giveIt(); });
  };
}
function wrapAnimation(done){
  paperC.style.transition = 'none'; paperC.style.clipPath = 'inset(100% 0 0 0)'; ribbonC.style.opacity = '0'; tagEl.classList.add('gone');
  W4.whoosh({ dur: .8, freq: 1800, q: .6, gain: .13, attack: .05, sweep: 700 });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    paperC.style.transition = 'clip-path .8s cubic-bezier(.6,0,.3,1)'; paperC.style.clipPath = 'inset(0 0 0 0)';
    setTimeout(() => { ribbonC.style.transition = 'opacity .4s'; ribbonC.style.opacity = '1'; W4.chime([1318, 1568], { gain: .05 }); }, 750);
    setTimeout(() => { tagEl.classList.remove('gone'); giftEl.classList.add('swing'); }, 1050);
    setTimeout(() => { paperC.style.transition = ''; paperC.style.clipPath = ''; ribbonC.style.transition = ''; giftEl.classList.remove('swing'); done(); }, 1900);
  }));
}
function giveIt(){
  const g = draftGift();
  W4.send(describeMine(g), { title: W4.t('giveTitle'), onSent: () => {
    shelf.unshift(Object.assign(g, { opened: true })); saveShelf();
    draft = { paper: draft.paper, ribbon: draft.ribbon, inside: '', rattle: '', msg: '' }; W4.store.set('gift-draft2', draft);
    W4.toast(W4.t('given')); setTimeout(home, 600);
  } });
}

/* ---------- start ---------- */
function boot(){
  layout();
  const incoming = W4.pasted();
  if(incoming){ W4.clearURL(); const r = receiveGift(incoming); if(typeof r === 'string'){ W4.toast(r); home(); } return; }
  const p = W4.params();
  if(p.has('inside')){ const t = ['paper', 'ribbon', 'tag', 'rattle', 'inside'].filter(k => p.get(k)).map(k => `${k}: ${p.get(k)}`).join('\n'); W4.clearURL(); receiveGift(t); return; }
  const waiting = shelf.find(g => g.dir === 'from' && !g.opened);
  if(waiting) setTable(waiting, 'closed'); else home();
}
addEventListener('resize', () => { clearTimeout(boot.t); boot.t = setTimeout(() => { layout(); if(gift){ paint(); requestAnimationFrame(() => drawRibbon(gift.ribbon, ['untied', 'unwrapped', 'open'].includes(state) ? 1 : 0, tagPos())); if(state === 'closed') makeGrid(); } }, 150); });
W4.onNames(() => { if(state === 'wrapping'){ gift = draftGift(); paint(); } render(); });
document.fonts && document.fonts.ready.then(() => { if(gift) requestAnimationFrame(() => drawRibbon(gift.ribbon, ['untied', 'unwrapped', 'open'].includes(state) ? 1 : 0, tagPos())); });
boot();
})();
</script>
</body>
</html>
