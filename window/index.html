<style data-shared="base.css">
/* Winter, for Two — shared styles. Light, modern, delicate.
   Source of truth for the block inlined into every page by tools/inline-shared.py.
   Edit here, then run:  python3 tools/inline-shared.py */
:root{
  --bg:#fbf8f5;
  --bg-2:#f4eee8;
  --surface:rgba(255,255,255,.74);
  --solid:#ffffff;
  --line:rgba(70,45,30,.09);
  --line-2:rgba(70,45,30,.17);
  --ink:#2a2421;
  --ink-2:#5f5550;
  --ink-3:#9c918a;
  --me:#f0935a;         /* the human: apricot */
  --me-soft:#fde8da;
  --them:#a48bea;       /* the companion: lilac */
  --them-soft:#eee8fc;
  --accent:#f0935a;
  --sky:#8fb9ea;
  --mint:#7fcbb0;
  --butter:#f6d488;
  --blush:#f5c6cc;
  --sans:"Plus Jakarta Sans","Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif","LXGW WenKai TC",Georgia,serif;
  --hand:"Caveat","LXGW WenKai TC","Kaiti TC",cursive;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:24px;
  --shadow:0 20px 44px -26px rgba(90,55,30,.30),0 2px 6px -3px rgba(90,55,30,.08);
  color-scheme:light;
}
html[lang^="zh"]{--serif:"LXGW WenKai TC","Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip}
/* soft light in the corners */
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(36% 30% at 10% 6%,rgba(255,204,168,.55),transparent 70%),radial-gradient(34% 30% at 94% 10%,rgba(206,190,250,.5),transparent 70%),
    radial-gradient(42% 34% at 74% 98%,rgba(172,206,245,.42),transparent 70%),radial-gradient(30% 26% at 4% 90%,rgba(250,198,210,.42),transparent 70%)}
body.plain::before{display:none}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
img,svg,canvas{display:block}
::selection{background:rgba(240,147,90,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
html[lang^="zh"] .eyebrow{letter-spacing:.2em;font-size:12.5px}
.display{font-family:var(--sans);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:0;color:var(--ink)}
.display em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
html[lang^="zh"] .display{font-family:"LXGW WenKai TC",var(--sans);font-weight:400;letter-spacing:.02em;line-height:1.2}
html[lang^="zh"] .display em{font-style:normal}
.lede{color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:10px 0 0;font-weight:400}
.muted{color:var(--ink-3)}
.hand{font-family:var(--hand)}

/* ---------- top bar ---------- */
.w4-top{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none}
.w4-top>*{pointer-events:auto}
.w4-home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:600;height:38px;padding:0 14px 0 10px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:color .2s,border-color .2s}
.w4-home:hover{color:var(--ink);border-color:var(--line-2)}
.w4-home svg{width:15px;height:15px}
.w4-spacer{flex:1}
.w4-icon{min-width:38px;height:38px;flex:none;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.72);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0 10px;font-size:13px;font-weight:700;transition:color .2s,border-color .2s}
.w4-icon:hover{color:var(--ink);border-color:var(--line-2)}
.w4-icon svg{width:17px;height:17px}
.w4-icon[aria-pressed="false"]{color:var(--ink-3)}
.w4-icon[aria-pressed="false"] .on{display:none}
.w4-icon[aria-pressed="true"] .off{display:none}

/* ---------- buttons ---------- */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:rgba(255,255,255,.82);color:var(--ink);min-height:44px;padding:10px 18px;border-radius:999px;
  font-size:14.5px;font-weight:600;letter-spacing:.005em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  box-shadow:0 6px 16px -12px rgba(90,55,30,.35);transition:transform .15s ease,background .2s,border-color .2s,opacity .2s,box-shadow .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:#fff;border-color:rgba(70,45,30,.26)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px -12px rgba(42,36,33,.7)}
.btn.primary:hover{background:#3a322e}
.btn.soft{background:var(--me-soft);border-color:transparent;color:#a4532a}
.btn.soft.them{background:var(--them-soft);color:#6a4fc4}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink-2)}
.btn.ghost:hover{background:rgba(70,45,30,.05)}
.btn.small{min-height:36px;padding:6px 13px;font-size:13.5px}
.btn.round{width:44px;padding:0}
.btn.small.round{width:36px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .sub,.label .sub{font-weight:400;color:var(--ink-3)}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--line-2);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.input::placeholder{color:#b9aea6}
.input:focus{border-color:rgba(240,147,90,.7);box-shadow:0 0 0 4px rgba(240,147,90,.13)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5;display:block}
.count{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;position:relative;background-size:cover;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(90,55,30,.4);transition:transform .15s,box-shadow .2s;flex:none}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),0 4px 10px -6px rgba(90,55,30,.4)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.panel h2{font-weight:500;font-size:17px;letter-spacing:-.01em;margin:0}
.panel .sub{color:var(--ink-3);font-size:13.5px;margin:3px 0 12px}

/* ---------- sheets (dialogs) ---------- */
dialog.w4-sheet{border:0;padding:0;margin:auto;background:transparent;color:var(--ink);max-width:min(540px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);overflow:visible}
dialog.w4-sheet::backdrop{background:rgba(60,40,30,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.w4-sheet[open]{animation:w4-rise .34s cubic-bezier(.2,.9,.3,1.12)}
.w4-sheet-in{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;box-shadow:0 40px 90px -36px rgba(70,40,20,.45);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.w4-sheet-in h3{font-weight:500;font-size:21px;letter-spacing:-.015em;line-height:1.2;margin:0}
.w4-sheet-in p{margin:0}
.w4-sheet-in textarea.input{min-height:170px;font-size:14.5px;background:var(--bg)}
.w4-sheet .tip{font-size:13.5px;color:var(--ink-3);line-height:1.5}
.w4-sheet .tip b{color:var(--ink-2);font-weight:600}
.w4-sheet .err{font-size:13.5px;color:#c4523a}
@keyframes w4-rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
.w4-toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;z-index:120;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:0 16px 36px -14px rgba(42,36,33,.6);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px);text-align:center}
.w4-toast.show{opacity:1;transform:translate(-50%,0)}

/* a gentle "look here" */
.pulse{animation:w4-pulse 2.4s ease-in-out infinite}
@keyframes w4-pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,147,90,0)}50%{box-shadow:0 0 0 7px rgba(240,147,90,.18)}}

/* ---------- the two voices ---------- */
.bridge{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who-me{color:var(--me)}
.who-them{color:var(--them)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}
.dot.me{background:var(--me)}.dot.them{background:var(--them)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
  html,body{height:100%;overflow:hidden;background:#efe9f2;overscroll-behavior:none}
  body::before{display:none}
  .stage{position:fixed;inset:0;perspective:1600px;overflow:hidden}
  #glass{position:absolute;left:0;top:0;width:100vw;height:100vh;height:100lvh;touch-action:none;cursor:crosshair;transform-origin:50% 50%;transition:transform 1.15s cubic-bezier(.62,.04,.22,1);will-change:transform}
  .stage.flipped #glass{transform:rotateY(180deg)}
  .frame{position:fixed;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 0 9px #f6f0e9,inset 0 0 0 10px rgba(120,90,60,.16),inset 0 0 60px rgba(255,255,255,.35)}
  .frame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(180deg,#efe5d9,#e2d4c3);box-shadow:0 -1px 0 rgba(120,90,60,.15)}
  .whisper{position:fixed;left:50%;top:max(84px,15vh);transform:translateX(-50%);z-index:3;margin:0;width:min(92vw,520px);text-align:center;
    font-size:clamp(16px,2.2vw,19px);line-height:1.45;color:#3a302b;font-weight:400;text-shadow:0 1px 14px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.7);pointer-events:none;transition:opacity 1.2s ease}
  html[lang^="zh"] .whisper{font-family:"LXGW WenKai TC",var(--sans)}
  .whisper small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#7a6e68;margin-top:8px;font-weight:600}
  html[lang^="zh"] .whisper small{letter-spacing:.2em;font-size:12.5px}
  .whisper.gone{opacity:0}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:30px 12px calc(16px + env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(180deg,rgba(251,248,245,0),rgba(251,248,245,.55) 50%,rgba(251,248,245,.82))}

  .dock-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .dock .btn{background:rgba(255,255,255,.78)}
  .dock .btn.primary{background:var(--ink)}
  .dock .btn[aria-pressed="true"]{border-color:rgba(240,147,90,.7);color:var(--accent)}
  .flipper{position:fixed;left:50%;top:60%;transform:translateX(-50%);z-index:6}
</style>

<body>

<div class="frame" aria-hidden="true"></div>
<p class="whisper" id="whisper"></p>
<p class="sr-only" id="said" aria-live="polite"></p>
<button class="btn small pulse flipper" id="flip" type="button" hidden></button>

  </div>
</nav>

<script data-shared="bridge.js">
/* Winter, for Two — the bridge.
   You play with your hands; your companion plays with words. These helpers carry
   words across: an invitation you copy to your companion, their reply pasted back

(function(){

W4.$ = (s, r) => (r || document).querySelector(s);

W4.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
W4.cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
W4.poss = s => W4.zh ? s + '的' : s + '’s';
W4.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
W4.reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
W4.coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
W4.date = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short', year:'numeric' });
W4.shortDate = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short' });
W4.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
W4.pick = a => a[Math.floor(Math.random() * a.length)];
W4.here = () => location.href.split('#')[0].split('?')[0];

/* ---------- names ---------- */
W4.names = function(){
  const me = String(W4.store.get('me', '') || '').trim();
  const them = String(W4.store.get('them', '') || '').trim();
  return { me: me || W4.t('meDefault'), them: them || W4.t('themDefault'), Them: them || W4.t('ThemDefault'), meName: me, themName: them,
    their: them ? W4.poss(them) : (W4.zh ? '對方的' : 'their') };
};
W4.onNames = cb => document.addEventListener('w4:names', cb);
W4.editNames = function(onDone){
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.t('who')}</p>

/* ---------- toast ---------- */
let toastEl = null, toastTimer = 0;
W4.toast = function(msg, ms){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'w4-toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite');
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2800);
};

/* ---------- sheets (modal dialogs) ---------- */
W4.sheet = function(html, cls){
  const d = document.createElement('dialog');
  d.className = 'w4-sheet' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  document.body.appendChild(d);
  let gone = false;
  const cleanup = () => { if(!gone){ gone = true; d.remove(); if(d.onDone) d.onDone(); } };
  d.done = () => { if(typeof d.close === 'function' && d.open) d.close(); else cleanup(); };
  d.addEventListener('close', () => setTimeout(cleanup, 30));
  d.addEventListener('click', e => {
    if(e.target === d) d.done();
    else if(e.target.closest('[data-a="close"]')) d.done();
  });
  if(typeof d.showModal === 'function') d.showModal();
  else { d.setAttribute('open', ''); d.style.cssText = 'position:fixed;inset:0;z-index:100;margin:auto'; }
  return d;
};

/* ---------- clipboard ---------- */
W4.copy = async function(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;';
    (document.querySelector('dialog[open]') || document.body).appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
};

/* Step 1 of the bridge: show the words you’re about to send, let you edit, copy. */
W4.send = function(text, opt){
  opt = opt || {};
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(opt.eyebrow || W4.t('forThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('sendTitle', { them: n.them }))}</h3>
    <p class="tip">${opt.tip || W4.t('sendTip')}</p>
    <textarea class="input" spellcheck="false" aria-label="${W4.esc(W4.t('sendTitle', { them: n.them }))}"></textarea>
    <div class="row end">
      <button class="btn ghost" data-a="close">${W4.t('close')}</button>
      ${navigator.share && W4.coarse ? `<button class="btn" data-a="share">${W4.t('share')}</button>` : ''}
      <button class="btn primary" data-a="copy">${W4.t('copy')}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea');
  ta.value = text;
  d.querySelector('[data-a="copy"]').onclick = async () => {
    const ok = await W4.copy(ta.value);
    if(ok){ d.done(); W4.toast(opt.copied || W4.t('copied', { them: n.them })); if(opt.onSent) opt.onSent(ta.value); }
    else { ta.focus(); ta.select(); W4.toast(W4.t('copyBlocked')); }
  };
  const sh = d.querySelector('[data-a="share"]');
  if(sh) sh.onclick = async () => {
    try{ await navigator.share({ text: ta.value }); d.done(); if(opt.onSent) opt.onSent(ta.value); }catch(e){}
  };
  return d;
};

/* Step 2 of the bridge: paste their reply back in. onText returns a string to show an error. */
W4.receive = function(opt){
  opt = opt || {};
  const n = W4.names();
  const canRead = !!(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext);
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(W4.t('fromThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('receiveTitle', { their: n.their }))}</h3>
    <p class="tip">${opt.tip || W4.t('receiveTip')}</p>
    <textarea class="input" spellcheck="false" placeholder="${W4.esc(opt.placeholder || '')}" aria-label="${W4.esc(W4.t('receiveTitle', { their: n.their }))}"></textarea>
    <p class="err" role="alert" hidden></p>
    <div class="row">
      ${canRead ? `<button class="btn small" data-a="clip">${W4.t('pasteClip')}</button>` : ''}
      <span class="spacer"></span>
      <button class="btn ghost" data-a="close">${W4.t('cancel')}</button>
      <button class="btn primary" data-a="go">${W4.esc(opt.go || W4.t('open'))}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea'), err = d.querySelector('.err');
  const clip = d.querySelector('[data-a="clip"]');
  if(clip) clip.onclick = async () => {
    try{ const t = await navigator.clipboard.readText(); if(t && t.trim()) ta.value = t; else W4.toast(W4.t('clipEmpty')); }
    catch(e){ W4.toast(W4.t('clipDenied')); }
  };
  d.querySelector('[data-a="go"]').onclick = () => {
    const t = ta.value.trim();
    if(!t){ ta.focus(); return; }
    const res = opt.onText(t);
    if(typeof res === 'string'){ err.textContent = res; err.hidden = false; return; }
    d.done();
  };
  if(!W4.coarse) setTimeout(() => ta.focus(), 60);
  return d;
};

/* ---------- state in the URL (#hash is never sent to the server) ---------- */
W4.enc = function(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let s = '';
  for(let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
W4.dec = function(str){
  try{
    let s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    const bin = atob(s), b = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(b));
  }catch(e){ return null; }
};
W4.params = function(){
  const map = {};
  const add = (k, v) => { k = k.toLowerCase().trim(); (map[k] = map[k] || []).push(v); };
  try{ new URLSearchParams(location.search).forEach((v, k) => add(k, v)); }catch(e){}
  const h = location.hash.replace(/^#/, '');
  if(h.includes('=')){ try{ new URLSearchParams(h).forEach((v, k) => add(k, v)); }catch(e){} }
  return { get: k => (map[k] || [])[0], all: k => map[k] || [], has: k => k in map, any: () => Object.keys(map).length > 0 };
};
/* A reply routed here from the home page’s “paste anything” box arrives as #paste=… */
W4.pasted = function(){ const v = W4.params().get('paste'); const t = v ? W4.dec(v) : null; return typeof t === 'string' ? t : null; };
W4.clearURL = function(){ try{ history.replaceState(null, '', location.pathname); }catch(e){} };
W4.link = function(obj){ return W4.here() + '#' + new URLSearchParams(obj).toString(); };

/* ---------- the forgiving reader ---------- */
/* Companions decorate. They add **bold**, emoji, *smiles softly*, quotes. We let them. */
W4.clean = function(s){
  s = String(s == null ? '' : s).replace(/\r/g, '').replace(/\*\*|__/g, '');
  s = s.replace(/^[\s*_~`]+|[\s*_~`]+$/g, '');
  const q = s.match(/^["“”'‘’「『«]([\s\S]*)["“”'‘’」』»]$/);
  if(q) s = q[1];
  return s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
};
W4.stripActions = s => String(s || '')
  .replace(/(^|\s)\*[^*\n]{1,140}\*(?=\s|$|[.,!?。，！？])/g, ' ')
  .replace(/(^|\s)[(（][^()（）\n]{1,140}[)）](?=\s|$)/g, ' ');
/* Read “Label: value” lines. spec = { key: ['label', 'synonym', …] } */
W4.fields = function(text, spec){
  const out = {}; let cur = null;
  const norm = s => s.toLowerCase().replace(/[*_`~#>\[\]()"“”「」【】]/g, '').replace(/\s+/g, ' ').trim();
  const keyOf = label => {
    const l = norm(label);
    if(!l || l.length > 28) return null;
    for(const k in spec) for(const syn of spec[k]){
      if(l === syn || l.startsWith(syn + ' ') || l.endsWith(' ' + syn)) return k;
    }
    return null;
  };
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  for(const raw of lines){
    const line = raw.replace(/^[\s>•·▪◦*+\-–—#]+/, '').replace(/^(?:\p{Extended_Pictographic}|️|‍|⃣)+\s*/u, '');
    const m = line.match(/^([^:：\n]{1,30}?)\s*[:：]\s*(.*)$/);
    if(m){
      const k = keyOf(m[1]);
      if(k){ cur = k; out[k] = out[k] ? out[k] + '\n' + m[2] : m[2]; continue; }
      if(/^\p{L}[\p{L} ']{0,22}$/u.test(norm(m[1]))){ cur = null; continue; }
    }
    if(!line.trim()){ if(cur && String(out[cur]).trim()) cur = null; continue; }
    if(cur) out[cur] += (String(out[cur]).trim() ? '\n' : '') + line.trim();
  }
  for(const k in out){ out[k] = W4.clean(out[k]); if(!out[k]) delete out[k]; }
  return out;
};
/* One short value: the labelled line if there is one, else a quoted phrase, else the message itself. */
W4.one = function(text, labels, max){
  max = max || 160;
  const f = W4.fields(text, { v: labels });
  let v = f.v;
  if(!v){
    const q = String(text).match(/["“「『]([^"”」』\n]{2,240})["”」』]/);
    v = q ? q[1] : W4.stripActions(text);
  }
  v = W4.clean(v).replace(/\s*\n\s*/g, ' ');
  if([...v].length > max){ v = [...v].slice(0, max).join('').replace(/\s+\S*$/, '') + '…'; }
  return v;
};
/* Which game is a pasted reply for? (Used by the home page’s “paste anything” box.) */
W4.detect = function(text){
  const t = String(text || '');
  const L = w => new RegExp('(^|\\n)[\\s>*_#•\\-–—]*(?:\\p{Extended_Pictographic}|\\uFE0F)*\\s*\\**(?:' + w + ')\\**\\s*[:：]', 'iu');
  if(L('glass|玻璃|窗上').test(t)) return 'window';
  if(L('flake|snowflake|雪花').test(t)) return 'snowflakes';
  if(L('inside|rattle|wrapping|paper|裡面|裏面|包裝紙|搖晃|聲音').test(t)) return 'gifts';
  if(L('notes?|melody|音符|旋律').test(t)) return 'music-box';
  if(L('punchline|grip|trinket|crown|笑點|握力|小玩意|紙皇冠|皇冠').test(t)) return 'cracker';
  if(/(^|\n)\s*[★⭐☆✦✧🌟]/u.test(t)) return 'star-jar';
  return null;
};

/* ---------- sound (synthesised, nothing to download) ---------- */
let actx = null, noiseBuf = null;
W4.soundOn = () => W4.store.get('sound', true) !== false;
W4.audio = function(){
  if(!W4.soundOn()) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx){ try{ actx = new AC(); }catch(e){ return null; } }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
};
W4.noise = function(ctx){
  if(noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
};
/* filtered-noise gesture: paper, breath, snow, wind */
W4.whoosh = function(o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ dur:.5, freq:900, q:.7, gain:.16, type:'bandpass', attack:.04, sweep:0, delay:0 }, o || {});
  const t = ctx.currentTime + o.delay;
  const src = ctx.createBufferSource(); src.buffer = W4.noise(ctx); src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = o.type; f.Q.value = o.q;
  f.frequency.setValueAtTime(o.freq, t);
  if(o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain, t + o.attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(t, Math.random()); src.stop(t + o.dur + .05);
};
/* small bell: freqs in Hz, played as a little arpeggio */
W4.chime = function(freqs, o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ gap:.09, gain:.1, decay:1.6 }, o || {});
  const t0 = ctx.currentTime + .01;
  [].concat(freqs).forEach((f, i) => {
    const t = t0 + i * o.gap;
    [[1, 1], [2.76, .26], [5.4, .08]].forEach(p => {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f * p[0];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain * p[1], t + .006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.decay / (.6 + p[0] * .4));
      osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + o.decay + .1);
    });
  });
};

/* ---------- fonts for canvas text ---------- */
W4.fontsReady = async function(spec, text){
  try{
    if(document.fonts && document.fonts.load){
      await Promise.race([document.fonts.load(spec, text || 'Aa'), new Promise(r => setTimeout(r, 2500))]);
    }
  }catch(e){}
};

/* ---------- save a canvas as an image (share sheet on phones) ---------- */
W4.saveCanvas = function(canvas, filename){
  canvas.toBlob(async blob => {
    if(!blob){ W4.toast(W4.t('imageFail')); return; }
    try{
      const file = new File([blob], filename, { type:'image/png' });
      if(W4.coarse && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
W4.downloadText = function(text, filename, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* ---------- gentle background snowfall ---------- */
W4.snowfall = function(canvas, o){
  o = Object.assign({ density:1, speed:1, color:'255,255,255', alpha:1 }, o || {});
  const ctx = canvas.getContext('2d'); let w = 0, h = 0, raf = 0, last = performance.now();
  const flakes = [];
  const make = any => { const z = Math.random(); return { x: Math.random() * w, y: any ? Math.random() * h : -8, r: .6 + z * 2, z, vy: (12 + z * 34) * o.speed, ph: Math.random() * 6.28, sw: 6 + Math.random() * 16 }; };
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 9000 * o.density);
    while(flakes.length < n) flakes.push(make(true));
    flakes.length = n;
    if(W4.reduced) draw(last);
  }
  function draw(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = 'rgb(' + o.color + ')';
    for(const f of flakes){
      f.y += f.vy * dt; f.ph += dt * (.5 + f.z);
      if(f.y > h + 6) Object.assign(f, make(false));
      ctx.globalAlpha = (.22 + f.z * .6) * o.alpha;
      ctx.beginPath(); ctx.arc(f.x + Math.sin(f.ph) * f.sw * .35, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const loop = t => { draw(t); raf = requestAnimationFrame(loop); };
  size(); addEventListener('resize', size);
  if(!W4.reduced) raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if(!document.hidden && !W4.reduced){ last = performance.now(); raf = requestAnimationFrame(loop); }
  });
};

/* ------------------------------------------------------------------
   Layers
   sharp  – the street outside, in focus (device pixels)
   blur   – the same street seen through condensation (css pixels)

const stage = $('#stage'), cv = $('#glass'), ctx = cv.getContext('2d');
const mk = () => document.createElement('canvas');
const sharp = mk(), blur = mk(), mask = mk(), comp = mk(), tmask = mk();
const sctx = sharp.getContext('2d'), bctx = blur.getContext('2d'), mctx = mask.getContext('2d'),
      cctx = comp.getContext('2d'), tctx = tmask.getContext('2d');
let W = 0, H = 0, DPR = 1, time = 0;
let bulbs = [], flakes = [], drops = [], breaths = [];

function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- a pastel winter dusk outside ---------- */
function paintScene(){
  const g = sctx, w = W, h = H, R = mulberry(1216);

  gr.addColorStop(0, 'rgba(255,248,236,.55)'); gr.addColorStop(1, 'rgba(255,248,236,0)');
  g.fillStyle = gr; g.fillRect(mx - mr * 7, my - mr * 7, mr * 14, mr * 14);
  g.fillStyle = '#fffaf0'; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  // far hills
  const hz = h * .6, hill = x => hz - 34 - Math.sin(x * .006) * 26 - Math.sin(x * .019 + 1) * 9;
  g.fillStyle = '#bdb6d6'; g.beginPath(); g.moveTo(0, h);

  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 2.5; g.beginPath();

  let x = -40 + R() * 20;

  g.globalCompositeOperation = 'source-over';

  gr.addColorStop(0, '#e3deee'); gr.addColorStop(.25, '#faf8fc'); gr.addColorStop(.7, '#e9e4f0'); gr.addColorStop(1, '#d6d0e2');
  g.fillStyle = gr; g.fillRect(0, base, w, h - base);
  g.strokeStyle = 'rgba(150,140,180,.25)'; g.lineWidth = 1.2;

  // street lamps

    const gy = base + (h - base) * (.22 + i * .05), top = gy - Math.max(130, h * .26);
    gr = g.createRadialGradient(lx, gy + 6, 0, lx, gy + 6, 130); gr.addColorStop(0, 'rgba(255,214,160,.5)'); gr.addColorStop(1, 'rgba(255,214,160,0)');
    g.save(); g.scale(1, .35); g.fillStyle = gr; g.beginPath(); g.arc(lx, (gy + 6) / .35, 130, 0, TAU); g.fill(); g.restore();
    g.strokeStyle = '#7d7494'; g.lineWidth = 4.5; g.beginPath(); g.moveTo(lx, gy); g.lineTo(lx, top); g.stroke();
    g.fillStyle = '#7d7494'; g.beginPath(); g.moveTo(lx - 11, top); g.lineTo(lx + 11, top); g.lineTo(lx + 7, top - 17); g.lineTo(lx - 7, top - 17); g.closePath(); g.fill();
    g.fillStyle = '#ffe6b4'; g.fillRect(lx - 7, top - 14, 14, 12);
    g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(lx, top - 18, 12, 4, 0, 0, TAU); g.fill();
    g.globalCompositeOperation = 'lighter';
    gr = g.createRadialGradient(lx, top - 8, 0, lx, top - 8, 90); gr.addColorStop(0, 'rgba(255,214,150,.7)'); gr.addColorStop(.3, 'rgba(255,200,130,.2)'); gr.addColorStop(1, 'rgba(255,200,130,0)');

  bulbs = [];
  const x0 = -30, x1 = w + 30, y0 = h * .17, y1 = h * .23, sag = Math.max(50, h * .09);
  const pt = t => [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + sag * 4 * t * (1 - t)];
  g.strokeStyle = 'rgba(90,80,110,.7)'; g.lineWidth = 1.4; g.beginPath();
  for(let t = 0; t <= 1.0001; t += .01){ const p = pt(t); t ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
  g.stroke();
  const cols = ['#ffcf7a', '#ff9c8c', '#fff1c6', '#ffb35e', '#ffb0c0', '#a9e2bf', '#ffd88f'];
  const n = Math.max(10, Math.round((x1 - x0) / 34));
  for(let i = 0; i <= n; i++){
    const p = pt(i / n), c = cols[i % cols.length];
    g.fillStyle = '#6f6680'; g.fillRect(p[0] - 2, p[1] - 1, 4, 5);
    g.fillStyle = c; g.beginPath(); g.ellipse(p[0], p[1] + 8, 3.6, 5.2, 0, 0, TAU); g.fill();

  }
}
function house(g, x, base, bw, bh, roof, R, glows){
  const top = base - bh, t = R() * 22;
  g.fillStyle = `rgb(${150 + t},${142 + t},${176 + t})`; g.fillRect(x, top, bw, bh);
  g.fillStyle = `rgb(${128 + t},${118 + t},${156 + t})`; g.beginPath(); g.moveTo(x - 6, top); g.lineTo(x + bw / 2, top - roof); g.lineTo(x + bw + 6, top); g.closePath(); g.fill();
  if(R() < .6){ const cx = x + bw * (.62 + R() * .2); g.fillStyle = `rgb(${132 + t},${122 + t},${160 + t})`; g.fillRect(cx, top - roof * .9, 12, roof * .7); g.fillStyle = '#fff'; g.fillRect(cx - 2, top - roof * .9 - 4, 16, 5); }
  g.strokeStyle = '#ffffff'; g.lineWidth = 6 + R() * 3; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - 4, top + 1); g.lineTo(x + bw / 2, top - roof + 2); g.lineTo(x + bw + 4, top + 1); g.stroke();
  const cols = Math.max(1, Math.floor(bw / 30)), rows = Math.max(1, Math.floor(bh / 38));
  const ww = 12 + R() * 5, wh = 15 + R() * 6;
  for(let c = 0; c < cols; c++) for(let r = 0; r < rows; r++){
    const wx = x + (c + .5) * bw / cols - ww / 2, wy = top + 12 + r * (bh - 18) / rows;
    if(wy + wh > base - 6) continue;
    const lit = R() < .72;
    g.fillStyle = lit ? (R() < .5 ? '#ffd38c' : '#ffc072') : '#b8b1cf';
    g.fillRect(wx, wy, ww, wh);
    if(lit){ g.fillStyle = 'rgba(150,90,40,.25)'; g.fillRect(wx + ww / 2 - .6, wy, 1.2, wh); g.fillRect(wx, wy + wh / 2 - .6, ww, 1.2); glows.push({ x: wx + ww / 2, y: wy + wh / 2, r: 26 + R() * 14 }); }
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(wx - 1, wy + wh, ww + 2, 2.5);
  }
}
function pine(g, x, base, ht){
  const tiers = 5, wd = ht * .55;
  for(let i = 0; i < tiers; i++){
    const t = i / tiers, y = base - ht * t * .92, tw = wd * (1 - t * .8), th = ht * .32;
    g.fillStyle = '#8791a8'; g.beginPath(); g.moveTo(x - tw / 2, y); g.lineTo(x, y - th); g.lineTo(x + tw / 2, y); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - tw * .42, y - 3); g.quadraticCurveTo(x - tw * .1, y - th * .35, x, y - th + 4); g.stroke();
    g.beginPath(); g.moveTo(x + tw * .12, y - th * .5); g.lineTo(x + tw * .38, y - 4); g.stroke();
  }
}

/* ---------- the same street, through condensation ---------- */
function makeBlur(){
  let src = sharp, w = sharp.width, h = sharp.height;
  const steps = Math.round(Math.log2(20 * DPR)), chain = [];
  for(let i = 0; i < steps; i++){
    w = Math.max(2, w >> 1); h = Math.max(2, h >> 1);
    const c = mk(); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, w, h);
    chain.push(c); src = c;
  }
  for(let i = chain.length - 2; i >= 0; i--){ const c = chain[i], x = c.getContext('2d'); x.globalCompositeOperation = 'copy'; x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height); src = c; }
  bctx.globalCompositeOperation = 'source-over'; bctx.imageSmoothingQuality = 'high';
  bctx.clearRect(0, 0, W, H); bctx.drawImage(src, 0, 0, W, H);
  bctx.fillStyle = 'rgba(255,253,252,.5)'; bctx.fillRect(0, 0, W, H);
  const R = mulberry(7);
  for(let i = 0, n = W * H / 50; i < n; i++){ bctx.fillStyle = `rgba(255,255,255,${.05 + R() * .12})`; const s = R() * 1.5 + .4; bctx.fillRect(R() * W, R() * H, s, s); }
}

/* ---------- fog ---------- */
function fogAll(){
  mctx.globalCompositeOperation = 'source-over'; mctx.clearRect(0, 0, W, H);
  const g = mctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,.84)'); g.addColorStop(.55, 'rgba(0,0,0,.92)'); g.addColorStop(1, 'rgba(0,0,0,.97)');
  mctx.fillStyle = g; mctx.fillRect(0, 0, W, H);
  for(let i = 0; i < 46; i++){
    const x = Math.random() * W, y = Math.random() * H, r = 40 + Math.random() * 150, rg = mctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(0,0,0,${.06 + Math.random() * .1})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = rg; mctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
const brush = mk();
(() => { brush.width = brush.height = 64; const b = brush.getContext('2d'), g = b.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.55, 'rgba(0,0,0,.95)'); g.addColorStop(.8, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  b.fillStyle = g; b.fillRect(0, 0, 64, 64); })();
function wipe(x0, y0, x1, y1, r){
  mctx.globalCompositeOperation = 'destination-out';
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / Math.max(1, r * .3)));
  for(let i = 0; i <= n; i++){
    const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    mctx.drawImage(brush, x - r, y - r, r * 2, r * 2);
    if(Math.random() < .02) addDrop(x + (Math.random() - .5) * r, y + r * .6, 1.2 + Math.random() * 2.2, Math.random() < .14);
  }
}
function breatheAt(x, y, r, s){
  mctx.globalCompositeOperation = 'source-over';
  const g = mctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${s})`); g.addColorStop(.7, `rgba(0,0,0,${s * .6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  mctx.fillStyle = g; mctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function breathFx(x, y, r){ breaths.push({ x, y, r, a: 1 }); if(breaths.length > 30) breaths.shift(); }
function bigBreath(){
  W4.whoosh({ dur: 1.4, freq: 520, q: .5, gain: .2, type: 'lowpass', attack: .25, sweep: 260 });
  lastBlock = null; $('#flip').hidden = true; setFlip(false);
  let k = 0;
  const run = () => { k++; breatheAt(W / 2, H * .9, W * (.25 + k * .06) + 120, .22); if(k % 3 === 0) breathFx(W / 2 + (Math.random() - .5) * W * .3, H * (.9 - k * .02), W * .35); if(k < 22) requestAnimationFrame(run); };
  run();
  for(const d of drops) d.dead = true;
  lastActivity = performance.now();
}

/* ---------- droplets ---------- */
function addDrop(x, y, r, run){ drops.push({ x, y, r, vy: 0, run, stop: y + 22 + Math.random() * 120, wait: .8 + Math.random() * 3 }); if(drops.length > 160) drops.shift(); }
function stepDrops(dt){
  for(const d of drops){
    if(!d.run) continue;
    if(d.wait > 0){ d.wait -= dt; continue; }
    d.vy = Math.min(46, d.vy + 50 * dt * (.3 + Math.random()));
    d.r = Math.max(1, d.r * (1 - dt * .06));
    mctx.globalCompositeOperation = 'destination-out';
    mctx.drawImage(brush, d.x - d.r * .75, d.y - d.r * .75, d.r * 1.5, d.r * 1.5);
    d.y += d.vy * dt; d.x += (Math.random() - .5) * .5;
    if(d.y >= d.stop || d.y > H - 3) d.run = false;
  }
  drops = drops.filter(d => !d.dead);
}
function drawDrops(g){
  for(const d of drops){
    const gr = g.createRadialGradient(d.x - d.r * .35, d.y - d.r * .4, d.r * .1, d.x, d.y, d.r);
    gr.addColorStop(0, 'rgba(255,255,255,.85)'); gr.addColorStop(.45, 'rgba(255,255,255,.15)'); gr.addColorStop(1, 'rgba(110,100,140,.35)');
    g.fillStyle = gr; g.beginPath(); g.arc(d.x, d.y, d.r, 0, TAU); g.fill();
  }
}

/* ---------- falling snow, twinkling lights ---------- */
function makeFlakes(){ flakes = Array.from({ length: Math.round(W * H / 5200) }, () => newFlake(true)); }
function newFlake(any){ const z = Math.random(); return { x: Math.random() * W, y: any ? Math.random() * H : -10, z, r: .6 + z * 2.4, vy: 16 + z * 52, ph: Math.random() * TAU, sw: 6 + Math.random() * 20 }; }
function stepSnow(dt){ if(W4.reduced) return; for(const f of flakes){ f.y += f.vy * dt; f.ph += dt * (.5 + f.z); if(f.y > H + 10) Object.assign(f, newFlake(false)); } }
function drawSnow(g, soft){
  g.fillStyle = soft ? 'rgba(255,255,255,.22)' : '#ffffff';
  for(const f of flakes){
    const x = f.x + Math.sin(f.ph) * f.sw * .4;
    if(soft){ if(f.z < .55) continue; g.beginPath(); g.arc(x, f.y, f.r * 3.4, 0, TAU); g.fill(); }
    else { g.globalAlpha = .45 + f.z * .55; g.beginPath(); g.arc(x, f.y, f.r, 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
}
const tw = b => W4.reduced ? .8 : .55 + .45 * Math.sin(time * b.sp + b.ph);
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a.toFixed(3)})`; }
function drawLights(g, soft){
  if(soft){
    for(const b of bulbs){ const a = tw(b), r = 15 + (b.ph % 1) * 10, gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, r); gr.addColorStop(0, hexA(b.c, .5 * a)); gr.addColorStop(.72, hexA(b.c, .34 * a)); gr.addColorStop(1, hexA(b.c, 0)); g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.fill(); }
  }else{
    g.globalCompositeOperation = 'lighter';
    for(const b of bulbs){ const a = tw(b), gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, 11); gr.addColorStop(0, hexA(b.c, .9 * a)); gr.addColorStop(1, hexA(b.c, 0)); g.fillStyle = gr; g.fillRect(b.x - 11, b.y - 11, 22, 22); }
    g.globalCompositeOperation = 'source-over';
  }
}
function drawBreaths(g, dt){
  for(const b of breaths){ b.a -= dt * .7; if(b.a <= 0) continue; const gr = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r); gr.addColorStop(0, `rgba(255,255,255,${.3 * b.a})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2); }
  breaths = breaths.filter(b => b.a > 0);
}
function drawRoom(g){
  // the warm room behind you, faintly reflected: a candle on the sill
  const f = W4.reduced ? 0 : Math.sin(time * 7.3) * .012 + Math.sin(time * 13.1) * .008;
  const x = W * .1, y = H * .97, r = Math.max(W, H) * .5, gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(255,178,110,${.13 + f})`); gr.addColorStop(1, 'rgba(255,178,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ---------- the invisible finger ---------- */
const FONT = s => `700 ${s}px Caveat, "LXGW WenKai TC", "Kaiti TC", cursive`;
let writer = null, lastBlock = null;
const pen = { x: 0, y: 0, a: 0, size: 60, warm: false };
const CJK = '\\u2E80-\\u9FFF\\uF900-\\uFAFF\\uFF00-\\uFFEF\\u3000-\\u303F\\uAC00-\\uD7AF';
const unitRe = new RegExp(`[${CJK}]|[^\\s${CJK}]+|\\s+`, 'g');
function wrap(text, maxW){
  const lines = []; let cur = '';
  for(const u of (text.match(unitRe) || [])){
    if(/^\s+$/.test(u)){ if(cur) cur += ' '; continue; }
    const test = cur + u;
    if(cur.trim() && tctx.measureText(test).width > maxW){ lines.push(cur.trim()); cur = u; } else cur = test;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
async function write(text, who){
  text = String(text || '').trim(); if(!text) return;
  await W4.fontsReady(FONT(64), text);
  setFlip(false);
  const mirror = who === 'them', maxW = Math.min(W * .86, 1000);
  let size = W4.clamp(W / 7.6, 42, 110), lines = [];
  for(let i = 0; i < 14; i++){
    tctx.font = FONT(size); lines = wrap(text, maxW);
    const widest = Math.max(...lines.map(l => tctx.measureText(l).width));
    if(lines.length * size * 1.08 < H * .46 && widest <= maxW) break;
    size *= .9;
  }
  const lh = size * 1.05, blockH = lines.length * lh;
  // a reply goes under the words already on the glass; if there's no room, breathe it clean first
  const floor = H - ($('.dock').offsetHeight || 160) - 24;
  let top = H * .41 - (lines.length - 1) * lh / 2;
  if(lastBlock && mirror === false && lastBlock.mirror !== mirror){
    const below = lastBlock.bottom + size * .55 + lh * .5;
    if(below + blockH - lh * .5 < floor) top = below; else quickFog();
  }else if(lastBlock) quickFog();
  lastBlock = { top: top - lh * .5, bottom: top + (lines.length - 1) * lh + lh * .5, mirror };
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
  if(mirror) tctx.setTransform(-1, 0, 0, 1, W, 0);
  tctx.font = FONT(size); tctx.textBaseline = 'middle'; tctx.lineJoin = 'round'; tctx.lineCap = 'round';
  tctx.fillStyle = tctx.strokeStyle = '#000'; tctx.lineWidth = Math.max(2, size * .075);
  const L = lines.map((s, i) => {
    const w = tctx.measureText(s).width, x = (W - w) / 2 + (Math.random() - .5) * size * .35, y = top + i * lh + (Math.random() - .5) * size * .08;
    const chars = []; let acc = '';
    for(const ch of s){ const x0 = tctx.measureText(acc).width; acc += ch; chars.push({ x0, x1: tctx.measureText(acc).width, sp: /\s/.test(ch) }); }
    tctx.fillText(s, x, y); tctx.strokeText(s, x, y);
    return { s, x, y, w, chars, done: -1 };
  });
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  writer = { lines: L, size, mirror, who, li: 0, ci: 0, t: -.45, text };
  pen.size = size; pen.warm = who === 'me';
  lastActivity = performance.now();
}
function stepWriter(dt){
  const w = writer; if(!w) return;
  w.t += dt;
  let guard = 0;
  while(w.li < w.lines.length && guard++ < 60){
    const line = w.lines[w.li], ch = line.chars[w.ci];
    if(w.t < 0){ placePen(line, ch.x0); break; }
    const dur = ch.sp ? .1 : .055 + (ch.x1 - ch.x0) / w.size * .17;
    if(w.t < dur){ reveal(line, ch.x0 + (ch.x1 - ch.x0) * (w.t / dur)); break; }
    w.t -= dur; w.ci++;
    if(w.ci >= line.chars.length){ reveal(line, line.w + w.size * .25); w.li++; w.ci = 0; w.t -= .34; }
    else reveal(line, ch.x1);
  }
  if(w.li >= w.lines.length) finishWriting();
}
function reveal(line, upto){
  const w = writer;
  if(upto <= line.done){ placePen(line, upto); return; }
  const from = line.done < 0 ? -w.size * .35 : line.done - 1;
  const ax = line.x + from, bx = line.x + upto;
  let sx = w.mirror ? W - bx : ax, sw = bx - ax;
  const sy = Math.max(0, Math.floor(line.y - w.size * .85)), sh = Math.min(H - sy, Math.ceil(w.size * 1.7));
  if(sx < 0){ sw += sx; sx = 0; }
  if(sx + sw > W) sw = W - sx;
  if(sw > 0 && sh > 0){ mctx.globalCompositeOperation = 'destination-out'; mctx.drawImage(tmask, sx, sy, sw, sh, sx, sy, sw, sh); }
  line.done = upto;
  placePen(line, upto);
  if(Math.random() < .05) addDrop(pen.x + (Math.random() - .5) * 8, line.y + w.size * (.18 + Math.random() * .22), 1.3 + Math.random() * 2.3, Math.random() < .16);
}
function placePen(line, upto){
  const w = writer, x = line.x + upto;
  pen.x = w.mirror ? W - x : x;
  pen.y = line.y + Math.sin(time * 17) * w.size * .2 + w.size * .04;
  pen.a = Math.min(1, pen.a + .15);
}
function drawPen(g, dt){
  if(!writer) pen.a = Math.max(0, pen.a - dt * 1.4);
  if(pen.a <= 0) return;
  const r = pen.size * .55, gr = g.createRadialGradient(pen.x, pen.y, 0, pen.x, pen.y, r), c = pen.warm ? '255,190,130' : '255,255,255';
  gr.addColorStop(0, `rgba(${c},${.6 * pen.a})`); gr.addColorStop(1, `rgba(${c},0)`);
  g.fillStyle = gr; g.fillRect(pen.x - r, pen.y - r, r * 2, r * 2);
}
function finishWriting(){
  const w = writer; writer = null;
  const n = W4.names();
  if(w.who === 'them'){
    $('#said').textContent = W4.t('said', { Them: n.Them, text: w.text });
    if(w.mirror){ const lastLine = w.lines[w.lines.length - 1], fb = $('#flip'); fb.style.top = Math.min(H - 190, lastLine.y + w.size * .85) + 'px'; fb.hidden = false; fb.classList.add('pulse'); whisper(W4.t('backwards', { Them: n.Them })); }
  }else{
    const fb = $('#flip'); if(!fb.hidden) fb.style.top = Math.min(H - 190, lastBlock.bottom + 12) + 'px';
    $('#tell').hidden = false; lastWrittenByMe = w.text;
    $('#said').textContent = W4.t('youWrote', { text: w.text });
  }
  W4.chime([1318, 1760], { gain: .035, gap: .14 });
}
function quickFog(){
  let k = 0;
  const step = () => { mctx.globalCompositeOperation = 'source-over'; mctx.fillStyle = 'rgba(0,0,0,.2)'; mctx.fillRect(0, 0, W, H); if(++k < 8) requestAnimationFrame(step); };
  step(); drops.forEach(d => d.dead = true); lastBlock = null;
}

/* ---------- composing a frame ---------- */
let raf = 0, last = performance.now(), lastActivity = performance.now(), lastRefog = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  stepWriter(dt); stepHold(dt); stepMic(); stepDrops(dt); stepSnow(dt);
  if(!writer && now - lastActivity > 30000 && now - lastRefog > 1000){ lastRefog = now; mctx.globalCompositeOperation = 'source-over'; mctx.fillStyle = 'rgba(0,0,0,.012)'; mctx.fillRect(0, 0, W, H); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(sharp, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawLights(ctx, false); drawSnow(ctx, false);
  cctx.globalCompositeOperation = 'copy'; cctx.drawImage(mask, 0, 0);
  cctx.globalCompositeOperation = 'source-in'; cctx.drawImage(blur, 0, 0);
  cctx.globalCompositeOperation = 'source-atop'; drawLights(cctx, true); drawSnow(cctx, true); drawBreaths(cctx, dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(comp, 0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawDrops(ctx); drawRoom(ctx); drawPen(ctx, dt);
  raf = requestAnimationFrame(frame);
}
function resize(){
  const r = cv.getBoundingClientRect(), nw = Math.round(r.width), nh = Math.round(r.height);
  if(nw === W && nh === H) return;
  let old = null;
  if(W){ old = mk(); old.width = W; old.height = H; old.getContext('2d').drawImage(mask, 0, 0); }
  W = nw; H = nh; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = sharp.width = Math.round(W * DPR); cv.height = sharp.height = Math.round(H * DPR);
  for(const c of [blur, mask, comp, tmask]){ c.width = W; c.height = H; }
  paintScene(); makeBlur(); makeFlakes();
  if(old) mctx.drawImage(old, 0, 0, W, H); else fogAll();
  writer = null;
}

/* ---------- your finger ---------- */
let hold = null, strokeLen = 0, lastWrittenByMe = '';
function pt(e){ const r = cv.getBoundingClientRect(); let x = e.clientX - r.left; const y = e.clientY - r.top; if(stage.classList.contains('flipped')) x = r.width - x; return { x, y }; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const p = pt(e); hold = { x: p.x, y: p.y, lx: p.x, ly: p.y, t: 0, moved: false, breathing: false }; whisperGone(); });
cv.addEventListener('pointermove', e => {
  if(!hold) return;
  const p = pt(e);
  if(!hold.moved && Math.hypot(p.x - hold.x, p.y - hold.y) > 4 && !hold.breathing) hold.moved = true;
  if(hold.moved){ wipe(hold.lx, hold.ly, p.x, p.y, e.pointerType === 'mouse' ? 11 : 14); strokeLen += Math.hypot(p.x - hold.lx, p.y - hold.ly); if(strokeLen > 260) $('#tell').hidden = false; }
  hold.lx = p.x; hold.ly = p.y; lastActivity = performance.now();
});
const endHold = () => { hold = null; };
cv.addEventListener('pointerup', endHold); cv.addEventListener('pointercancel', endHold);
function stepHold(dt){
  if(!hold || hold.moved) return;
  hold.t += dt;
  if(hold.t > .38){
    if(!hold.breathing){ hold.breathing = true; W4.whoosh({ dur: 1.1, freq: 600, q: .5, gain: .14, type: 'lowpass', attack: .2, sweep: 300 }); }
    const r = 30 + Math.min(1.6, hold.t - .38) * 95;
    breatheAt(hold.x, hold.y, r, .07);
    if(Math.random() < .25) breathFx(hold.x, hold.y, r * 1.2);
    lastActivity = performance.now();
  }
}

/* ---------- blowing into the microphone ---------- */
let mic = null;
async function toggleMic(){
  const b = $('#mic');
  if(mic){ mic.stream.getTracks().forEach(t => t.stop()); try{ mic.ctx.close(); }catch(e){} mic = null; b.setAttribute('aria-pressed', 'false'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const AC = window.AudioContext || window.webkitAudioContext, ac = new AC(), an = ac.createAnalyser(); an.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(an);
    mic = { stream, ctx: ac, an, buf: new Float32Array(an.fftSize) };
    b.setAttribute('aria-pressed', 'true'); W4.toast(W4.t('micOn'));
  }catch(e){ W4.toast(W4.t('micNo')); }
}
function stepMic(){
  if(!mic) return;
  mic.an.getFloatTimeDomainData(mic.buf);
  let s = 0; for(let i = 0; i < mic.buf.length; i++) s += mic.buf[i] * mic.buf[i];
  const rms = Math.sqrt(s / mic.buf.length);
  if(rms > .07){ const x = W / 2 + (Math.random() - .5) * 60, y = H * .86; breatheAt(x, y, 90 + rms * 900, Math.min(.2, rms * .9)); if(Math.random() < .3) breathFx(x, y - 40, 120 + rms * 700); lastActivity = performance.now(); }
}

/* ---------- words in, words out ---------- */
const whisperEl = $('#whisper');
function whisper(html){ whisperEl.innerHTML = html; whisperEl.classList.remove('gone'); clearTimeout(whisper.t); whisper.t = setTimeout(whisperGone, 9000); }
function whisperGone(){ whisperEl.classList.add('gone'); }
function setFlip(on){ stage.classList.toggle('flipped', on); $('#flip').textContent = W4.t(on ? 'flipBack' : 'flip'); }
function relabel(){
  const n = W4.names();
  $('#ask').textContent = W4.t('ask', { them: n.them }); $('#paste').textContent = W4.t('paste', { their: n.their }); $('#tell').textContent = W4.t('tell', { them: n.them });
  $('#flip').textContent = W4.t(stage.classList.contains('flipped') ? 'flipBack' : 'flip');
}
relabel(); W4.onNames(relabel);
whisperEl.innerHTML = W4.t('start');

function receiveWords(text){
  const words = W4.one(text, ['glass', 'window', 'fog', 'on the glass', 'writes', 'written', '玻璃', '窗上', '窗戶', '霧上'], 90);
  if(!words) return W4.t('noWords');
  arrive(words);
}
function arrive(words){
  $('#flip').hidden = true;
  whisper(W4.t('writing', { Them: W4.names().Them }));
  quickFog();
  setTimeout(() => write(words, 'them'), 900);
}
$('#ask').onclick = () => W4.send(W4.t('askText', { url: W4.here() }), { title: W4.t('inviteTitle') });
$('#paste').onclick = () => W4.receive({ title: W4.t('pasteTitle', { them: W4.names().them }), tip: W4.t('pasteTip'), placeholder: W4.t('pastePh'), go: W4.t('pasteGo'), onText: receiveWords });
$('#flip').onclick = () => { setFlip(!stage.classList.contains('flipped')); $('#flip').classList.remove('pulse'); whisperGone(); };
$('#breathe').onclick = () => { whisperGone(); bigBreath(); };
$('#mic').onclick = toggleMic;
$('#write').onclick = () => {
  const d = W4.sheet(`<div class="w4-sheet-in"><h3>${W4.t('writeTitle')}</h3><p class="tip">${W4.t('writeTip')}</p>
    <input class="input" maxlength="80" placeholder="${W4.esc(W4.t('writePh'))}" aria-label="${W4.esc(W4.t('writeTitle'))}">
    <div class="row end"><button class="btn ghost" data-a="close">${W4.t('cancel')}</button><button class="btn primary" data-a="go">${W4.t('writeGo')}</button></div></div>`);
  const inp = d.querySelector('input');
  const go = () => { const t = inp.value.trim(); if(!t){ inp.focus(); return; } d.done(); whisperGone(); setTimeout(() => write(t, 'me'), 250); };
  d.querySelector('[data-a="go"]').onclick = go;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  if(!W4.coarse) setTimeout(() => inp.focus(), 60);
};
$('#tell').onclick = () => W4.send(lastWrittenByMe ? W4.t('tellTyped', { text: lastWrittenByMe }) : W4.t('tellDrawn'), { title: W4.t('tellTitle') });
$('#save').onclick = () => {
  const c = mk(); c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d');
  if(stage.classList.contains('flipped')){ g.translate(c.width, 0); g.scale(-1, 1); }
  g.drawImage(cv, 0, 0); g.setTransform(1, 0, 0, 1, 0, 0);
  g.font = `600 ${13 * DPR}px "Plus Jakarta Sans", "Chiron GoRound TC", sans-serif`; g.textAlign = 'right'; g.fillStyle = 'rgba(60,45,40,.55)';
  g.fillText(W4.t('caption'), c.width - 20 * DPR, c.height - 20 * DPR);
  W4.saveCanvas(c, 'the-other-side-of-the-glass.png');
};

/* ---------- start ---------- */
resize();
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if(!document.hidden){ last = performance.now(); raf = requestAnimationFrame(frame); } });
raf = requestAnimationFrame(frame);
const incoming = W4.pasted() || W4.params().get('glass') || W4.params().get('say');
if(incoming){ W4.clearURL(); setTimeout(() => { whisperGone(); receiveWords(incoming); }, 700); }
})();
</script>
</body>
</html>
