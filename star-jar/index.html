<style data-shared="base.css">
/* Winter, for Two — shared styles. Light, modern, delicate.
   Source of truth for the block inlined into every page by tools/inline-shared.py.
   Edit here, then run:  python3 tools/inline-shared.py */
:root{
  --bg:#fbf8f5;
  --bg-2:#f4eee8;
  --surface:rgba(255,255,255,.74);
  --solid:#ffffff;
  --line:rgba(70,45,30,.09);
  --line-2:rgba(70,45,30,.17);
  --ink:#2a2421;
  --ink-2:#5f5550;
  --ink-3:#9c918a;
  --me:#f0935a;         /* the human: apricot */
  --me-soft:#fde8da;
  --them:#a48bea;       /* the companion: lilac */
  --them-soft:#eee8fc;
  --accent:#f0935a;
  --sky:#8fb9ea;
  --mint:#7fcbb0;
  --butter:#f6d488;
  --blush:#f5c6cc;
  --sans:"Plus Jakarta Sans","Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif","LXGW WenKai TC",Georgia,serif;
  --hand:"Caveat","LXGW WenKai TC","Kaiti TC",cursive;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:24px;
  --shadow:0 20px 44px -26px rgba(90,55,30,.30),0 2px 6px -3px rgba(90,55,30,.08);
  color-scheme:light;
}
html[lang^="zh"]{--serif:"LXGW WenKai TC","Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip}
/* soft light in the corners */
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(36% 30% at 10% 6%,rgba(255,204,168,.55),transparent 70%),radial-gradient(34% 30% at 94% 10%,rgba(206,190,250,.5),transparent 70%),
    radial-gradient(42% 34% at 74% 98%,rgba(172,206,245,.42),transparent 70%),radial-gradient(30% 26% at 4% 90%,rgba(250,198,210,.42),transparent 70%)}
body.plain::before{display:none}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
img,svg,canvas{display:block}
::selection{background:rgba(240,147,90,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
html[lang^="zh"] .eyebrow{letter-spacing:.2em;font-size:12.5px}
.display{font-family:var(--sans);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:0;color:var(--ink)}
.display em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
html[lang^="zh"] .display{font-family:"LXGW WenKai TC",var(--sans);font-weight:400;letter-spacing:.02em;line-height:1.2}
html[lang^="zh"] .display em{font-style:normal}
.lede{color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:10px 0 0;font-weight:400}
.muted{color:var(--ink-3)}
.hand{font-family:var(--hand)}

/* ---------- top bar ---------- */
.w4-top{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));pointer-events:none}
.w4-top>*{pointer-events:auto}
.w4-home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:600;height:38px;padding:0 14px 0 10px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:color .2s,border-color .2s}
.w4-home:hover{color:var(--ink);border-color:var(--line-2)}
.w4-home svg{width:15px;height:15px}
.w4-spacer{flex:1}
.w4-icon{min-width:38px;height:38px;flex:none;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.72);box-shadow:0 6px 16px -10px rgba(90,55,30,.35);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0 10px;font-size:13px;font-weight:700;transition:color .2s,border-color .2s}
.w4-icon:hover{color:var(--ink);border-color:var(--line-2)}
.w4-icon svg{width:17px;height:17px}
.w4-icon[aria-pressed="false"]{color:var(--ink-3)}
.w4-icon[aria-pressed="false"] .on{display:none}
.w4-icon[aria-pressed="true"] .off{display:none}

/* ---------- buttons ---------- */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:rgba(255,255,255,.82);color:var(--ink);min-height:44px;padding:10px 18px;border-radius:999px;
  font-size:14.5px;font-weight:600;letter-spacing:.005em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  box-shadow:0 6px 16px -12px rgba(90,55,30,.35);transition:transform .15s ease,background .2s,border-color .2s,opacity .2s,box-shadow .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:#fff;border-color:rgba(70,45,30,.26)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px -12px rgba(42,36,33,.7)}
.btn.primary:hover{background:#3a322e}
.btn.soft{background:var(--me-soft);border-color:transparent;color:#a4532a}
.btn.soft.them{background:var(--them-soft);color:#6a4fc4}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink-2)}
.btn.ghost:hover{background:rgba(70,45,30,.05)}
.btn.small{min-height:36px;padding:6px 13px;font-size:13.5px}
.btn.round{width:44px;padding:0}
.btn.small.round{width:36px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .sub,.label .sub{font-weight:400;color:var(--ink-3)}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--line-2);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.input::placeholder{color:#b9aea6}
.input:focus{border-color:rgba(240,147,90,.7);box-shadow:0 0 0 4px rgba(240,147,90,.13)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5;display:block}
.count{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;position:relative;background-size:cover;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(90,55,30,.4);transition:transform .15s,box-shadow .2s;flex:none}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),0 4px 10px -6px rgba(90,55,30,.4)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.panel h2{font-weight:500;font-size:17px;letter-spacing:-.01em;margin:0}
.panel .sub{color:var(--ink-3);font-size:13.5px;margin:3px 0 12px}

/* ---------- sheets (dialogs) ---------- */
dialog.w4-sheet{border:0;padding:0;margin:auto;background:transparent;color:var(--ink);max-width:min(540px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);overflow:visible}
dialog.w4-sheet::backdrop{background:rgba(60,40,30,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.w4-sheet[open]{animation:w4-rise .34s cubic-bezier(.2,.9,.3,1.12)}
.w4-sheet-in{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;box-shadow:0 40px 90px -36px rgba(70,40,20,.45);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.w4-sheet-in h3{font-weight:500;font-size:21px;letter-spacing:-.015em;line-height:1.2;margin:0}
.w4-sheet-in p{margin:0}
.w4-sheet-in textarea.input{min-height:170px;font-size:14.5px;background:var(--bg)}
.w4-sheet .tip{font-size:13.5px;color:var(--ink-3);line-height:1.5}
.w4-sheet .tip b{color:var(--ink-2);font-weight:600}
.w4-sheet .err{font-size:13.5px;color:#c4523a}
@keyframes w4-rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
.w4-toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;z-index:120;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:0 16px 36px -14px rgba(42,36,33,.6);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px);text-align:center}
.w4-toast.show{opacity:1;transform:translate(-50%,0)}

/* a gentle "look here" */
.pulse{animation:w4-pulse 2.4s ease-in-out infinite}
@keyframes w4-pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,147,90,0)}50%{box-shadow:0 0 0 7px rgba(240,147,90,.18)}}

/* ---------- the two voices ---------- */
.bridge{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who-me{color:var(--me)}
.who-them{color:var(--them)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}
.dot.me{background:var(--me)}.dot.them{background:var(--them)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
  .wrap{max-width:1040px;margin:0 auto;padding:74px 16px 60px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "jar" "acts" "bridge"}
  .head{grid-area:head}.jarcol{grid-area:jar}.acts{grid-area:acts}.bridge-card{grid-area:bridge}
  @media (min-width:920px){ .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:44px;grid-template-areas:"jar head" "jar acts" "jar bridge" "jar .";grid-template-rows:auto auto auto 1fr;padding-top:96px} }
  .head h1{font-size:clamp(32px,8vw,46px)}
  .jarcol{position:relative;display:flex;flex-direction:column;align-items:center}
  .glowbg{position:absolute;left:50%;top:6%;width:min(92vw,480px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle at 50% 45%,rgba(255,214,186,.85),rgba(236,206,240,.55) 48%,rgba(206,214,246,.0) 72%);filter:blur(6px)}
  #snow{position:absolute;inset:0 -8%;width:116%;height:100%;pointer-events:none}
  .stagewrap{position:relative;z-index:1;width:min(92vw,430px)}
  #jar{display:block;width:100%;aspect-ratio:1/1.12;touch-action:none;cursor:grab}
  #jar:active{cursor:grabbing}
  .sill{position:relative;z-index:2;width:min(98vw,520px);height:16px;margin-top:-18px;border-radius:999px;background:linear-gradient(180deg,#efe3d3,#e2d1bc);box-shadow:0 16px 30px -16px rgba(90,55,30,.45),inset 0 1px 0 rgba(255,255,255,.8)}
  .tally{position:relative;z-index:2;margin:16px 0 0;color:var(--ink-2);font-size:14px;text-align:center}
  .tally b{color:var(--accent);font-weight:600}
  .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  @media (min-width:920px){ .acts{justify-content:flex-start} }
  .bridge-card{padding:18px}
  .tiny{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
  .flyer{position:fixed;z-index:80;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(90,55,30,.25))}
  .veil{position:fixed;inset:0;z-index:70;background:rgba(251,248,245,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .4s;pointer-events:none}
  .veil.on{opacity:1;pointer-events:auto}
  .slip{position:fixed;z-index:85;left:50%;top:46%;width:min(88vw,440px);transform:translate(-50%,-50%) scaleX(.06) scaleY(.4);opacity:0;transition:transform .7s cubic-bezier(.2,1.2,.3,1),opacity .3s;pointer-events:none}
  .slip.on{transform:translate(-50%,-50%) rotate(-1.2deg);opacity:1;pointer-events:auto}
  .slip .paper{background:#fff;color:#3a2f2a;border-radius:14px;padding:20px 22px 16px;box-shadow:0 30px 60px -28px rgba(90,55,30,.5),0 0 0 1px rgba(70,45,30,.05);border-left:8px solid var(--c,#f0935a)}
  .slip .t{font-family:var(--hand);font-size:clamp(24px,6vw,30px);line-height:1.1;white-space:pre-wrap;word-break:break-word}
  html[lang^="zh"] .slip .t{font-size:clamp(19px,4.8vw,23px);line-height:1.55}
  .slip .m{margin-top:12px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
  .slip .row{margin-top:14px;justify-content:center}
  .list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
  .list .month{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:10px 0 0}
  .item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
  .item i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
  .item div{flex:1;min-width:0}
  .item p{margin:0;font-size:14.5px;line-height:1.45;word-break:break-word}
  .item small{color:var(--ink-3);font-size:12px}
  .item button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:4px}
  .colors{display:flex;gap:9px;flex-wrap:wrap}
</style>

<body>
<main class="wrap">
  <header class="head">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 class="display" data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>
  <section class="jarcol" data-i18n-aria="eyebrow">
    <div class="glowbg" aria-hidden="true"></div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="stagewrap"><canvas id="jar" role="img" data-i18n-aria="jarAria"></canvas></div>
    <div class="sill" aria-hidden="true"></div>
    <p class="tally" id="count" aria-live="polite"></p>
  </section>
  <div class="acts">
    <button class="btn primary" id="fold" type="button" data-i18n="fold"></button>
    <button class="btn" id="take" type="button" data-i18n="take"></button>
    <button class="btn" id="read" type="button" data-i18n="read"></button>
  </div>
  <section class="panel bridge-card" aria-labelledby="bTitle">
    <h2 id="bTitle"></h2>
    <p class="sub" data-i18n="bridgeSub"></p>
    <div class="bridge">
      <button class="btn primary" id="ask" type="button"></button>
      <button class="btn" id="paste" type="button"></button>
    </div>
    <div class="tiny">
      <button class="btn small" id="tellAll" type="button"></button>
      <button class="btn small" id="backup" type="button" data-i18n="backup"></button>
      <button class="btn small" id="restore" type="button" data-i18n="restore"></button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>
<div class="veil" id="veil"></div>
<div class="slip" id="slip" role="dialog" aria-modal="true" aria-labelledby="slipT">
  <div class="paper"><div class="t" id="slipT"></div><div class="m" id="slipM"></div></div>
  <div class="row"><button class="btn" id="slipBack" type="button" data-i18n="foldBack"></button><button class="btn primary" id="slipSend" type="button"></button><button class="btn small ghost" id="slipNext" type="button" data-i18n="another"></button></div>
</div>

<script data-shared="bridge.js">
/* Winter, for Two — the bridge.
   You play with your hands; your companion plays with words. These helpers carry
   words across: an invitation you copy to your companion, their reply pasted back
   in (read forgivingly), and a few things kept in this browser. English and
   繁體中文. No dependencies, no servers, no tracking.
   Source of truth for the block inlined into every page by tools/inline-shared.py.
   Edit here, then run:  python3 tools/inline-shared.py */
(function(){
'use strict';
const W4 = window.W4 = {};
const NS = 'w4t:';

/* ---------- storage: never throws (private windows, blocked storage) ---------- */
W4.store = {
  get(k, d){ try{ const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(NS + k); }catch(e){} }
};

/* ---------- language ---------- */
W4.lang = (function(){
  let p = null;
  try{ p = new URLSearchParams(location.hash.slice(1)).get('lang') || new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(p === 'zh' || p === 'en'){ W4.store.set('lang', p); return p; }
  const s = W4.store.get('lang', null);
  if(s === 'zh' || s === 'en') return s;
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
})();
W4.zh = W4.lang === 'zh';
document.documentElement.lang = W4.zh ? 'zh-Hant' : 'en';
const DICT = { en: {}, zh: {} };
W4.i18n = function(d){ for(const l in d){ DICT[l] = Object.assign(DICT[l] || {}, d[l]); } if(document.readyState !== 'loading') W4.applyI18n(); };
W4.t = function(key, vars){
  let s = DICT[W4.lang][key]; if(s === undefined) s = DICT.en[key]; if(s === undefined) return key;
  if(typeof s === 'function') return s(vars || {});
  return vars ? String(s).replace(/\{(\w+)\}/g, (_, k) => (vars[k] == null ? '' : vars[k])) : s;
};
/* pick the right string from an { en, zh } pair */
W4.L = o => (o && typeof o === 'object' && ('en' in o || 'zh' in o)) ? (o[W4.lang] != null ? o[W4.lang] : o.en) : o;
W4.applyI18n = function(root){
  const r = root || document;
  r.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = W4.t(el.dataset.i18n); });
  r.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = W4.t(el.dataset.i18nPh); });
  r.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', W4.t(el.dataset.i18nAria)); });
  r.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = W4.t(el.dataset.i18nTitle); });
};
W4.setLang = l => { W4.store.set('lang', l); location.reload(); };

/* ---------- small helpers ---------- */
W4.$ = (s, r) => (r || document).querySelector(s);
W4.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
W4.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
W4.cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
W4.poss = s => W4.zh ? s + '的' : s + '’s';
W4.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
W4.reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
W4.coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
W4.date = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short', year:'numeric' });
W4.shortDate = d => new Date(d || Date.now()).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { day:'numeric', month:'short' });
W4.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
W4.pick = a => a[Math.floor(Math.random() * a.length)];
W4.here = () => location.href.split('#')[0].split('?')[0];

/* ---------- names ---------- */
W4.names = function(){
  const me = String(W4.store.get('me', '') || '').trim();
  const them = String(W4.store.get('them', '') || '').trim();
  return { me: me || W4.t('meDefault'), them: them || W4.t('themDefault'), Them: them || W4.t('ThemDefault'), meName: me, themName: them,
    their: them ? W4.poss(them) : (W4.zh ? '對方的' : 'their') };
};
W4.onNames = cb => document.addEventListener('w4:names', cb);
W4.editNames = function(onDone){
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.t('who')}</p>
    <h3>${W4.t('namesTitle')}</h3>
    <p class="tip">${W4.t('namesTip')}</p>
    <div class="field"><label for="w4-me">${W4.t('you')}</label><input id="w4-me" class="input" maxlength="24" autocomplete="nickname" placeholder="${W4.t('yourName')}"></div>
    <div class="field"><label for="w4-them">${W4.t('companion')}</label><input id="w4-them" class="input" maxlength="24" autocomplete="off" placeholder="${W4.t('theirName')}"></div>
    <div class="row end"><button class="btn ghost" data-a="close">${W4.t('cancel')}</button><button class="btn primary" data-a="save">${W4.t('save')}</button></div>
  </div>`);
  const me = d.querySelector('#w4-me'), them = d.querySelector('#w4-them');
  me.value = n.meName; them.value = n.themName;
  d.querySelector('[data-a="save"]').onclick = () => {
    W4.store.set('me', me.value.trim()); W4.store.set('them', them.value.trim());
    d.done(); document.dispatchEvent(new CustomEvent('w4:names'));
    if(onDone) onDone();
  };
  return d;
};

/* ---------- toast ---------- */
let toastEl = null, toastTimer = 0;
W4.toast = function(msg, ms){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'w4-toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite');
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2800);
};

/* ---------- sheets (modal dialogs) ---------- */
W4.sheet = function(html, cls){
  const d = document.createElement('dialog');
  d.className = 'w4-sheet' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  document.body.appendChild(d);
  let gone = false;
  const cleanup = () => { if(!gone){ gone = true; d.remove(); if(d.onDone) d.onDone(); } };
  d.done = () => { if(typeof d.close === 'function' && d.open) d.close(); else cleanup(); };
  d.addEventListener('close', () => setTimeout(cleanup, 30));
  d.addEventListener('click', e => {
    if(e.target === d) d.done();
    else if(e.target.closest('[data-a="close"]')) d.done();
  });
  if(typeof d.showModal === 'function') d.showModal();
  else { d.setAttribute('open', ''); d.style.cssText = 'position:fixed;inset:0;z-index:100;margin:auto'; }
  return d;
};

/* ---------- clipboard ---------- */
W4.copy = async function(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;';
    (document.querySelector('dialog[open]') || document.body).appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
};

/* Step 1 of the bridge: show the words you’re about to send, let you edit, copy. */
W4.send = function(text, opt){
  opt = opt || {};
  const n = W4.names();
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(opt.eyebrow || W4.t('forThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('sendTitle', { them: n.them }))}</h3>
    <p class="tip">${opt.tip || W4.t('sendTip')}</p>
    <textarea class="input" spellcheck="false" aria-label="${W4.esc(W4.t('sendTitle', { them: n.them }))}"></textarea>
    <div class="row end">
      <button class="btn ghost" data-a="close">${W4.t('close')}</button>
      ${navigator.share && W4.coarse ? `<button class="btn" data-a="share">${W4.t('share')}</button>` : ''}
      <button class="btn primary" data-a="copy">${W4.t('copy')}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea');
  ta.value = text;
  d.querySelector('[data-a="copy"]').onclick = async () => {
    const ok = await W4.copy(ta.value);
    if(ok){ d.done(); W4.toast(opt.copied || W4.t('copied', { them: n.them })); if(opt.onSent) opt.onSent(ta.value); }
    else { ta.focus(); ta.select(); W4.toast(W4.t('copyBlocked')); }
  };
  const sh = d.querySelector('[data-a="share"]');
  if(sh) sh.onclick = async () => {
    try{ await navigator.share({ text: ta.value }); d.done(); if(opt.onSent) opt.onSent(ta.value); }catch(e){}
  };
  return d;
};

/* Step 2 of the bridge: paste their reply back in. onText returns a string to show an error. */
W4.receive = function(opt){
  opt = opt || {};
  const n = W4.names();
  const canRead = !!(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext);
  const d = W4.sheet(`<div class="w4-sheet-in">
    <p class="eyebrow">${W4.esc(W4.t('fromThem', { them: n.them }))}</p>
    <h3>${W4.esc(opt.title || W4.t('receiveTitle', { their: n.their }))}</h3>
    <p class="tip">${opt.tip || W4.t('receiveTip')}</p>
    <textarea class="input" spellcheck="false" placeholder="${W4.esc(opt.placeholder || '')}" aria-label="${W4.esc(W4.t('receiveTitle', { their: n.their }))}"></textarea>
    <p class="err" role="alert" hidden></p>
    <div class="row">
      ${canRead ? `<button class="btn small" data-a="clip">${W4.t('pasteClip')}</button>` : ''}
      <span class="spacer"></span>
      <button class="btn ghost" data-a="close">${W4.t('cancel')}</button>
      <button class="btn primary" data-a="go">${W4.esc(opt.go || W4.t('open'))}</button>
    </div>
  </div>`);
  const ta = d.querySelector('textarea'), err = d.querySelector('.err');
  const clip = d.querySelector('[data-a="clip"]');
  if(clip) clip.onclick = async () => {
    try{ const t = await navigator.clipboard.readText(); if(t && t.trim()) ta.value = t; else W4.toast(W4.t('clipEmpty')); }
    catch(e){ W4.toast(W4.t('clipDenied')); }
  };
  d.querySelector('[data-a="go"]').onclick = () => {
    const t = ta.value.trim();
    if(!t){ ta.focus(); return; }
    const res = opt.onText(t);
    if(typeof res === 'string'){ err.textContent = res; err.hidden = false; return; }
    d.done();
  };
  if(!W4.coarse) setTimeout(() => ta.focus(), 60);
  return d;
};

/* ---------- state in the URL (#hash is never sent to the server) ---------- */
W4.enc = function(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let s = '';
  for(let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
W4.dec = function(str){
  try{
    let s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    const bin = atob(s), b = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(b));
  }catch(e){ return null; }
};
W4.params = function(){
  const map = {};
  const add = (k, v) => { k = k.toLowerCase().trim(); (map[k] = map[k] || []).push(v); };
  try{ new URLSearchParams(location.search).forEach((v, k) => add(k, v)); }catch(e){}
  const h = location.hash.replace(/^#/, '');
  if(h.includes('=')){ try{ new URLSearchParams(h).forEach((v, k) => add(k, v)); }catch(e){} }
  return { get: k => (map[k] || [])[0], all: k => map[k] || [], has: k => k in map, any: () => Object.keys(map).length > 0 };
};
/* A reply routed here from the home page’s “paste anything” box arrives as #paste=… */
W4.pasted = function(){ const v = W4.params().get('paste'); const t = v ? W4.dec(v) : null; return typeof t === 'string' ? t : null; };
W4.clearURL = function(){ try{ history.replaceState(null, '', location.pathname); }catch(e){} };
W4.link = function(obj){ return W4.here() + '#' + new URLSearchParams(obj).toString(); };

/* ---------- the forgiving reader ---------- */
/* Companions decorate. They add **bold**, emoji, *smiles softly*, quotes. We let them. */
W4.clean = function(s){
  s = String(s == null ? '' : s).replace(/\r/g, '').replace(/\*\*|__/g, '');
  s = s.replace(/^[\s*_~`]+|[\s*_~`]+$/g, '');
  const q = s.match(/^["“”'‘’「『«]([\s\S]*)["“”'‘’」』»]$/);
  if(q) s = q[1];
  return s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
};
W4.stripActions = s => String(s || '')
  .replace(/(^|\s)\*[^*\n]{1,140}\*(?=\s|$|[.,!?。，！？])/g, ' ')
  .replace(/(^|\s)[(（][^()（）\n]{1,140}[)）](?=\s|$)/g, ' ');
/* Read “Label: value” lines. spec = { key: ['label', 'synonym', …] } */
W4.fields = function(text, spec){
  const out = {}; let cur = null;
  const norm = s => s.toLowerCase().replace(/[*_`~#>\[\]()"“”「」【】]/g, '').replace(/\s+/g, ' ').trim();
  const keyOf = label => {
    const l = norm(label);
    if(!l || l.length > 28) return null;
    for(const k in spec) for(const syn of spec[k]){
      if(l === syn || l.startsWith(syn + ' ') || l.endsWith(' ' + syn)) return k;
    }
    return null;
  };
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  for(const raw of lines){
    const line = raw.replace(/^[\s>•·▪◦*+\-–—#]+/, '').replace(/^(?:\p{Extended_Pictographic}|️|‍|⃣)+\s*/u, '');
    const m = line.match(/^([^:：\n]{1,30}?)\s*[:：]\s*(.*)$/);
    if(m){
      const k = keyOf(m[1]);
      if(k){ cur = k; out[k] = out[k] ? out[k] + '\n' + m[2] : m[2]; continue; }
      if(/^\p{L}[\p{L} ']{0,22}$/u.test(norm(m[1]))){ cur = null; continue; }
    }
    if(!line.trim()){ if(cur && String(out[cur]).trim()) cur = null; continue; }
    if(cur) out[cur] += (String(out[cur]).trim() ? '\n' : '') + line.trim();
  }
  for(const k in out){ out[k] = W4.clean(out[k]); if(!out[k]) delete out[k]; }
  return out;
};
/* One short value: the labelled line if there is one, else a quoted phrase, else the message itself. */
W4.one = function(text, labels, max){
  max = max || 160;
  const f = W4.fields(text, { v: labels });
  let v = f.v;
  if(!v){
    const q = String(text).match(/["“「『]([^"”」』\n]{2,240})["”」』]/);
    v = q ? q[1] : W4.stripActions(text);
  }
  v = W4.clean(v).replace(/\s*\n\s*/g, ' ');
  if([...v].length > max){ v = [...v].slice(0, max).join('').replace(/\s+\S*$/, '') + '…'; }
  return v;
};
/* Which game is a pasted reply for? (Used by the home page’s “paste anything” box.) */
W4.detect = function(text){
  const t = String(text || '');
  const L = w => new RegExp('(^|\\n)[\\s>*_#•\\-–—]*(?:\\p{Extended_Pictographic}|\\uFE0F)*\\s*\\**(?:' + w + ')\\**\\s*[:：]', 'iu');
  if(L('glass|玻璃|窗上').test(t)) return 'window';
  if(L('flake|snowflake|雪花').test(t)) return 'snowflakes';
  if(L('inside|rattle|wrapping|paper|裡面|裏面|包裝紙|搖晃|聲音').test(t)) return 'gifts';
  if(L('notes?|melody|音符|旋律').test(t)) return 'music-box';
  if(L('punchline|grip|trinket|crown|笑點|握力|小玩意|紙皇冠|皇冠').test(t)) return 'cracker';
  if(/(^|\n)\s*[★⭐☆✦✧🌟]/u.test(t)) return 'star-jar';
  return null;
};

/* ---------- sound (synthesised, nothing to download) ---------- */
let actx = null, noiseBuf = null;
W4.soundOn = () => W4.store.get('sound', true) !== false;
W4.audio = function(){
  if(!W4.soundOn()) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx){ try{ actx = new AC(); }catch(e){ return null; } }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
};
W4.noise = function(ctx){
  if(noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
};
/* filtered-noise gesture: paper, breath, snow, wind */
W4.whoosh = function(o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ dur:.5, freq:900, q:.7, gain:.16, type:'bandpass', attack:.04, sweep:0, delay:0 }, o || {});
  const t = ctx.currentTime + o.delay;
  const src = ctx.createBufferSource(); src.buffer = W4.noise(ctx); src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = o.type; f.Q.value = o.q;
  f.frequency.setValueAtTime(o.freq, t);
  if(o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain, t + o.attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(t, Math.random()); src.stop(t + o.dur + .05);
};
/* small bell: freqs in Hz, played as a little arpeggio */
W4.chime = function(freqs, o){
  const ctx = W4.audio(); if(!ctx) return;
  o = Object.assign({ gap:.09, gain:.1, decay:1.6 }, o || {});
  const t0 = ctx.currentTime + .01;
  [].concat(freqs).forEach((f, i) => {
    const t = t0 + i * o.gap;
    [[1, 1], [2.76, .26], [5.4, .08]].forEach(p => {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f * p[0];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain * p[1], t + .006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.decay / (.6 + p[0] * .4));
      osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + o.decay + .1);
    });
  });
};

/* ---------- fonts for canvas text ---------- */
W4.fontsReady = async function(spec, text){
  try{
    if(document.fonts && document.fonts.load){
      await Promise.race([document.fonts.load(spec, text || 'Aa'), new Promise(r => setTimeout(r, 2500))]);
    }
  }catch(e){}
};

/* ---------- save a canvas as an image (share sheet on phones) ---------- */
W4.saveCanvas = function(canvas, filename){
  canvas.toBlob(async blob => {
    if(!blob){ W4.toast(W4.t('imageFail')); return; }
    try{
      const file = new File([blob], filename, { type:'image/png' });
      if(W4.coarse && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
W4.downloadText = function(text, filename, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* ---------- gentle background snowfall ---------- */
W4.snowfall = function(canvas, o){
  o = Object.assign({ density:1, speed:1, color:'255,255,255', alpha:1 }, o || {});
  const ctx = canvas.getContext('2d'); let w = 0, h = 0, raf = 0, last = performance.now();
  const flakes = [];
  const make = any => { const z = Math.random(); return { x: Math.random() * w, y: any ? Math.random() * h : -8, r: .6 + z * 2, z, vy: (12 + z * 34) * o.speed, ph: Math.random() * 6.28, sw: 6 + Math.random() * 16 }; };
  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 9000 * o.density);
    while(flakes.length < n) flakes.push(make(true));
    flakes.length = n;
    if(W4.reduced) draw(last);
  }
  function draw(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = 'rgb(' + o.color + ')';
    for(const f of flakes){
      f.y += f.vy * dt; f.ph += dt * (.5 + f.z);
      if(f.y > h + 6) Object.assign(f, make(false));
      ctx.globalAlpha = (.22 + f.z * .6) * o.alpha;
      ctx.beginPath(); ctx.arc(f.x + Math.sin(f.ph) * f.sw * .35, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const loop = t => { draw(t); raf = requestAnimationFrame(loop); };
  size(); addEventListener('resize', size);

  // a pale oak lid
  g.save(); g.translate(0, -lidLift);
  const lw = J.nw + 20, lx = J.cx - lw / 2, ly = J.neckTop - 24;
  const lg2 = g.createLinearGradient(0, ly, 0, ly + 24); lg2.addColorStop(0, '#f1e2cc'); lg2.addColorStop(1, '#dcc3a2');
  g.fillStyle = lg2; g.beginPath(); if(g.roundRect) g.roundRect(lx, ly, lw, 24, 8); else g.rect(lx, ly, lw, 24); g.fill();
  g.strokeStyle = 'rgba(150,110,70,.25)'; g.lineWidth = 1; for(let k = 1; k < 4; k++){ g.beginPath(); g.moveTo(lx + 10, ly + k * 6); g.bezierCurveTo(lx + lw * .4, ly + k * 6 + 2, lx + lw * .6, ly + k * 6 - 2, lx + lw - 10, ly + k * 6); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(lx + 8, ly + 2, lw - 16, 2);
  g.restore();
  // a small paper tag on a cord
  const tx = J.nr + 12, ty = J.neckTop + 30;
  g.strokeStyle = 'rgba(150,120,90,.7)'; g.lineWidth = 1; g.beginPath(); g.moveTo(J.nr + 2, J.neckTop + 6); g.quadraticCurveTo(tx - 4, ty - 16, tx + 6, ty + 2); g.stroke();
  g.save(); g.translate(tx, ty); g.rotate(.16 - jarX * .004);
  g.fillStyle = '#ffffff'; g.shadowColor = 'rgba(90,55,30,.25)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(56, -4); g.lineTo(62, 12); g.lineTo(56, 28); g.lineTo(0, 30); g.closePath(); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#e7dccf'; g.beginPath(); g.arc(8, 15, 2.4, 0, TAU); g.fill();
  g.fillStyle = '#5f5550'; g.font = `500 ${W4.zh ? 11 : 10.5}px ${W4.zh ? '"LXGW WenKai TC",' : ''}"Geist Mono",monospace`; g.textAlign = 'center';
  g.fillText(W4.t('usYear', { y: new Date().getFullYear() }), 34, 19);
  g.restore();
  g.restore();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; time += dt;
  let sx = 0, sy = 0;
  if(held){
    const nx = W4.clamp(held.tx, -70, 70), ny = W4.clamp(held.ty, -40, 30);
    sx = W4.clamp(nx - jarX, -26, 26); sy = W4.clamp(ny - jarY, -26, 26);
    jarVX = sx / dt; jarVY = sy / dt; jarX += sx; jarY += sy;
    if(Math.abs(sx) > 9 && now - (loop.clink || 0) > 120){ loop.clink = now; clink(Math.abs(sx) / 26); }
  }else if(Math.abs(jarX) + Math.abs(jarY) + Math.abs(jarVX) + Math.abs(jarVY) > .05){
    jarVX += (-jarX * 170 - jarVX * 14) * dt; jarVY += (-jarY * 170 - jarVY * 14) * dt;
    sx = jarVX * dt; sy = jarVY * dt; jarX += sx; jarY += sy;
  }
  step(dt / 2, sx / 2, sy / 2); step(dt / 2, sx / 2, sy / 2);
  if(lidLift > 0) lidLift = Math.max(0, lidLift - dt * 40);
  draw();
  requestAnimationFrame(loop);
}
function clink(v){ W4.whoosh({ dur: .05 + Math.random() * .05, freq: 2600 + Math.random() * 2600, q: 6, gain: .05 + v * .07, attack: .002 }); }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const r = cv.getBoundingClientRect(); held = { x0: e.clientX, y0: e.clientY, tx: jarX, ty: jarY, bx: jarX, by: jarY, moved: false, lx: e.clientX - r.left - jarX, ly: e.clientY - r.top - jarY }; });
cv.addEventListener('pointermove', e => { if(!held) return; const dx = e.clientX - held.x0, dy = e.clientY - held.y0; if(Math.hypot(dx, dy) > 6) held.moved = true; held.tx = held.bx + dx; held.ty = held.by + dy; });
const release = () => { const h = held; held = null; if(h && !h.moved){ let best = null, bd = R * 1.4; for(const b of bodies){ const d = Math.hypot(b.x - h.lx, b.y - h.ly); if(d < bd){ bd = d; best = b; } } if(best) takeOut(best); } };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', () => { held = null; });

/* ======================================================================
   Folding and unfolding
   ====================================================================== */
function starSVG(color){
  const pts = []; for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 11.5 : 20; pts.push([22 + Math.cos(a) * rr, 22 + Math.sin(a) * rr]); }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let m = mid(pts[0], pts[1]), d = `M${m[0].toFixed(1)} ${m[1].toFixed(1)}`;
  for(let i = 1; i <= 10; i++){ const p = pts[i % 10]; m = mid(p, pts[(i + 1) % 10]); d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`; }
  return `<svg viewBox="0 0 44 44" width="44" height="44"><defs><radialGradient id="sg" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="${color}"/><stop offset="1" stop-color="${color}"/></radialGradient></defs><path d="${d} Z" fill="url(#sg)" stroke="rgba(120,80,50,.25)" stroke-width=".8"/></svg>`;
}
const jarScreen = (x, y) => { const r = cv.getBoundingClientRect(); return { x: r.left + x + jarX, y: r.top + y + jarY }; };
function fly(color, from, to, ms, s0, s1){
  const el = document.createElement('div'); el.className = 'flyer'; el.innerHTML = starSVG(color); el.style.left = '0'; el.style.top = '0'; document.body.append(el);
  return el.animate([
    { transform: `translate(${from.x}px,${from.y}px) scale(${s0}) rotate(0deg)` },
    { transform: `translate(${(from.x + to.x) / 2}px,${Math.min(from.y, to.y) - 90}px) scale(${(s0 + s1) / 2}) rotate(200deg)`, offset: .5 },
    { transform: `translate(${to.x}px,${to.y}px) scale(${s1}) rotate(400deg)` }
  ], { duration: W4.reduced ? 1 : ms, easing: 'cubic-bezier(.35,0,.25,1)', fill: 'forwards' }).finished.then(() => el);
}
function dropIn(s, from){
  return fly(s.color, from || { x: innerWidth / 2, y: innerHeight * .45 }, jarScreen(J.cx, J.neckTop + R * 1.5), 900, 2.2, R / 18).then(el => {
    el.remove(); lidLift = 14;
    addBody(s, J.cx + (Math.random() - .5) * J.nw * .4, J.neckTop + R * 1.4, (Math.random() - .5) * 2, 3);
    W4.whoosh({ dur: .12, freq: 1800, q: 1.5, gain: .07, attack: .004 }); setTimeout(() => clink(.6), 160);
  });
}
let open = null;
function takeOut(b){
  if(open) return;
  const i = bodies.indexOf(b); if(i < 0) return;
  bodies.splice(i, 1); open = b.s;
  W4.chime([1568, 2093], { gain: .045, gap: .1 });
  fly(b.s.color, jarScreen(b.x, b.y), { x: innerWidth / 2, y: innerHeight * .42 }, 800, R / 18, 2.4).then(el => { el.remove(); showSlip(b.s); });
  $('#veil').classList.add('on');
}
function showSlip(s){
  const n = W4.names();
  $('#slip').style.setProperty('--c', s.color);
  $('#slipT').textContent = s.text;
  $('#slipM').textContent = W4.t('foldedBy', { who: s.by === 'me' ? n.me : n.them, date: W4.date(s.date) });
  $('#slipSend').textContent = W4.t(s.by === 'me' ? 'sendMine' : 'remind', { them: n.them });
  $('#slip').classList.add('on');
  W4.whoosh({ dur: .4, freq: 2400, q: .6, gain: .08, attack: .02, sweep: 900 });
  setTimeout(() => $('#slipBack').focus({ preventScroll: true }), 200);
}
function foldBack(){ const s = open; if(!s) return; $('#slip').classList.remove('on'); setTimeout(() => { $('#veil').classList.remove('on'); dropIn(s).then(() => { open = null; }); }, 250); }
$('#slipBack').onclick = foldBack; $('#veil').onclick = foldBack;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && open) foldBack(); });
$('#slipNext').onclick = () => {
  const s = open; if(!s) return;
  $('#slip').classList.remove('on'); open = null;
  addBody(s, J.cx + (Math.random() - .5) * 20, J.neckTop + R * 1.4, 0, 2);
  setTimeout(() => { const b = randomBody(); if(b) takeOut(b); else $('#veil').classList.remove('on'); }, 300);
};
$('#slipSend').onclick = () => {
  const s = open; if(!s) return;
  W4.send(W4.t(s.by === 'me' ? 'starMine' : 'starTheirs', { date: W4.date(s.date), text: s.text }), { title: W4.t(s.by === 'me' ? 'sendStarTitle' : 'remindTitle') });
};
function randomBody(){
  if(!bodies.length) return null;
  bodies.sort((a, b) => (a.s.seen || 0) - (b.s.seen || 0));
  const b = bodies[Math.floor(Math.random() * Math.min(bodies.length, Math.max(3, bodies.length / 3)))];
  b.s.seen = Date.now(); saveStars(); return b;
}
function compose(){
  const d = W4.sheet(`<div class="w4-sheet-in"><h3>${W4.t('composeTitle')}</h3><p class="tip">${W4.t('composeTip')}</p>
    <textarea class="input" maxlength="220" placeholder="${W4.esc(W4.t('composePh'))}" aria-label="${W4.esc(W4.t('composeTitle'))}"></textarea>
    <div class="row"><span class="label">${W4.t('paperColor')}</span><div class="colors" id="cols" role="radiogroup" aria-label="${W4.esc(W4.t('paperColor'))}"></div></div>
    <div class="row end"><button class="btn ghost" data-a="close">${W4.t('cancel')}</button><button class="btn primary" data-a="go">${W4.t('foldIt')}</button></div></div>`);
  const ta = d.querySelector('textarea'); ta.style.minHeight = '120px';
  const cols = d.querySelector('#cols');
  MY_COLORS.forEach(c => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.style.background = c; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', c); b.setAttribute('aria-checked', String(c === pickColor));
    b.onclick = () => { pickColor = c; W4.store.set('star-color2', c); cols.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-checked', String(x === b))); };
    cols.append(b);
  });
  d.querySelector('[data-a="go"]').onclick = () => {
    const t = ta.value.trim(); if(!t){ ta.focus(); return; }
    d.done();
    const s = { id: W4.uid(), text: t, by: 'me', color: pickColor, date: Date.now() };
    stars.push(s); saveStars(); updateCount(); maybeResize();
    setTimeout(() => dropIn(s), 150);
  };
  if(!W4.coarse) setTimeout(() => ta.focus(), 60);
}
function maybeResize(){ const nr = radiusFor(stars.length + 4); if(Math.abs(nr - R) > .6){ R = nr; sprites.clear(); } }

/* ======================================================================
   Words: asking, receiving, remembering
   ====================================================================== */
function parseStars(text){
  const out = [];
  for(const raw of String(text).replace(/\r/g, '').split('\n')){
    const m = raw.match(/^\s*(?:[★⭐☆✦✧🌟✨]+|[*•·\-–]|\d{1,2}[.)、])\s*(.+)$/u);
    if(m){ const t = W4.clean(m[1].replace(/^\*\*[^*]*\*\*\s*[:：]?\s*/, '')); if(t.length > 1) out.push(t); }
  }
  if(out.length) return out.slice(0, 12);
  return String(W4.stripActions(text)).split(/\n\s*\n/).map(p => W4.clean(p.replace(/\n/g, ' '))).filter(p => p.length > 2).slice(0, 5);
}
function receive(text){
  const list = parseStars(text);
  if(!list.length) return W4.t('noStars');
  const base = stars.filter(s => s.by === 'them').length;
  list.forEach((t, i) => {
    const s = { id: W4.uid(), text: t.slice(0, 280), by: 'them', color: THEIR_COLORS[(base + i) % THEIR_COLORS.length], date: Date.now() };
    stars.push(s);
    setTimeout(() => dropIn(s, { x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .2 }), 300 + i * 650);
  });
  saveStars(); maybeResize(); updateCount();
  scrollTo({ top: 0, behavior: W4.reduced ? 'auto' : 'smooth' });
  W4.toast(W4.t(list.length === 1 ? 'gotStar' : 'gotStars', { n: list.length, them: W4.names().Them }));
}
function everything(){
  const mine = stars.filter(s => s.by === 'me').length;
  const lines = stars.slice().sort((a, b) => a.date - b.date).map(s => `★ (${W4.shortDate(s.date)}, ${W4.t(s.by === 'me' ? 'lineMe' : 'lineYou')}) ${s.text}`);
  return W4.t('everything', { n: stars.length, mine, theirs: stars.length - mine, lines: lines.join('\n') });
}
function readAll(){
  const n = W4.names();
  if(!stars.length){ W4.toast(W4.t('emptyJar')); return; }
  const byMonth = new Map();
  stars.slice().sort((a, b) => b.date - a.date).forEach(s => { const k = new Date(s.date).toLocaleDateString(W4.zh ? 'zh-Hant' : undefined, { month: 'long', year: 'numeric' }); (byMonth.get(k) || byMonth.set(k, []).get(k)).push(s); });
  let html = '';
  for(const [k, list] of byMonth){
    html += `<p class="month">${W4.esc(k)}</p>` + list.map(s => `<div class="item"><i style="background:${s.color}"></i><div><p>${W4.esc(s.text)}</p><small>${W4.esc(s.by === 'me' ? n.me : n.them)} · ${W4.date(s.date)}</small></div><button type="button" data-del="${s.id}" aria-label="${W4.esc(W4.t('takeOut'))}" title="${W4.esc(W4.t('takeOut'))}">×</button></div>`).join('');
  }
  const d = W4.sheet(`<div class="w4-sheet-in"><p class="eyebrow">${W4.t('eyebrow')}</p><h3>${W4.t('everythingTitle', { n: stars.length })}</h3><div class="list">${html}</div><div class="row end"><button class="btn" data-a="tell">${W4.esc(W4.t('tellEverything', { them: n.them }))}</button><button class="btn primary" data-a="close">${W4.t('closeBtn')}</button></div></div>`);
  d.querySelector('[data-a="tell"]').onclick = () => { d.done(); setTimeout(() => W4.send(everything(), { title: W4.t('allTitle'), tip: W4.t('allTip') }), 80); };
  d.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if(!confirm(W4.t('takeOut'))) return;
    const id = b.dataset.del; stars = stars.filter(s => s.id !== id); saveStars();
    const bi = bodies.findIndex(x => x.s.id === id); if(bi >= 0) bodies.splice(bi, 1);
    b.closest('.item').remove(); updateCount();
  });
}
function updateCount(){
  const n = W4.names(), mine = stars.filter(s => s.by === 'me').length, theirs = stars.length - mine;
  $('#count').innerHTML = !stars.length ? W4.esc(W4.t('empty')) : stars.length === 1 ? W4.t('countOne') : W4.t('count', { n: stars.length, mine, theirs, me: W4.esc(n.meName ? (W4.zh ? n.meName : W4.poss(n.meName)) : W4.t('yours')), them: W4.esc(n.themName ? (W4.zh ? n.themName : W4.poss(n.themName)) : W4.t('theirs')) });
  $('#take').disabled = !stars.length;
  $('#bTitle').textContent = W4.t('bTitle', { them: n.Them });
  $('#ask').textContent = W4.t('ask', { them: n.them });
  $('#paste').textContent = W4.t('paste', { their: n.their });
  $('#tellAll').textContent = W4.t('tellAll', { them: n.them });
}
$('#fold').onclick = compose;
$('#take').onclick = () => {
  if(!bodies.length) return;
  let k = 0; const go = () => { held = { tx: k % 2 ? -50 : 50, ty: -10, bx: 0, by: 0 }; if(++k < 6) setTimeout(go, 110); else { held = null; setTimeout(() => { const b = randomBody(); if(b) takeOut(b); }, 450); } };
  go();
};
$('#read').onclick = readAll;
$('#ask').onclick = () => W4.send(W4.t('askText'), { title: W4.t('askTitle') });
$('#paste').onclick = () => W4.receive({ title: W4.t('pasteTitle'), tip: W4.t('pasteTip'), placeholder: W4.t('pastePh'), go: W4.t('pasteGo'), onText: receive });
$('#tellAll').onclick = () => { if(!stars.length){ W4.toast(W4.t('nothing')); return; } W4.send(everything(), { title: W4.t('allTitle'), tip: W4.t('allTip') }); };
$('#backup').onclick = () => { W4.downloadText(JSON.stringify({ kind: 'winter-for-two/star-jar', version: 1, stars }, null, 2), `star-jar-${new Date().toISOString().slice(0, 10)}.json`, 'application/json'); W4.toast(W4.t('saved')); };
$('#restore').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text()), list = Array.isArray(data) ? data : data.stars;
    if(!Array.isArray(list)) throw new Error('no stars');
    const have = new Set(stars.map(s => s.id)); let added = 0;
    for(const s of list){ if(s && s.text && !have.has(s.id)){ const t = { id: s.id || W4.uid(), text: String(s.text).slice(0, 280), by: s.by === 'them' ? 'them' : 'me', color: s.color || MY_COLORS[0], date: s.date || Date.now() }; stars.push(t); addBody(t, J.cx + (Math.random() - .5) * J.nw * .5, J.neckTop + R * 2 + Math.random() * 40, 0, 0); added++; } }
    saveStars(); maybeResize(); updateCount(); W4.toast(W4.t('restored', { n: added }));
  }catch(err){ W4.toast(W4.t('badFile')); }
  e.target.value = '';
};

/* ---------- start ---------- */
size(); makeBulbs();
for(const s of stars) addBody(s, J.cx + (Math.random() - .5) * J.jw * .7, J.top + J.sh + Math.random() * (J.jh - J.sh) * .8, 0, 0);
for(let i = 0; i < 260; i++) step(1 / 60, 0, 0);
updateCount();
W4.onNames(updateCount);
addEventListener('resize', () => { clearTimeout(size.t); size.t = setTimeout(() => { size(); makeBulbs(); }, 120); });
const incoming = W4.pasted() || (W4.params().all('star').length ? W4.params().all('star').map(s => '★ ' + s).join('\n') : null);
if(incoming){ W4.clearURL(); setTimeout(() => { const r = receive(incoming); if(typeof r === 'string') W4.toast(r); }, 500); }
requestAnimationFrame(loop);
})();
</script>
